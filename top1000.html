<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 1000 in the World, 40 Cool Pursuits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --border: #e8e3d9;
  --border-dark: #c8c2b4;
  --text: #1c1a16;
  --muted: #8a8070;
  --faint: #b8b0a0;
  --green: #1a6645;
  --green-bg: #e4f2eb;
  --green-border: #a0d4b8;
  --blue: #1a4a8a;
  --blue-bg: #e6eef8;
  --blue-border: #92b4e0;
  --amber: #7a4a0a;
  --amber-bg: #fdf0d8;
  --amber-border: #e8c070;
  --red: #7a1a1a;
  --red-bg: #fde8e8;
  --red-border: #e09090;
  --tag-high: #1c1a16;
  --tag-high-bg: #e8e3d9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }

/* HERO */
.hero { margin-bottom: 2.5rem; }
.hero-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.hero h1 { font-family: 'DM Serif Display', serif; font-size: clamp(32px, 5vw, 52px); font-weight: 400; line-height: 1.1; letter-spacing: -0.01em; color: var(--text); margin-bottom: 12px; }
.hero h1 span { color: var(--muted); }
.hero p { font-size: 14px; color: var(--muted); max-width: 560px; line-height: 1.7; margin-bottom: 1.5rem; }

/* PROGRESS */
.prog-row { display: flex; align-items: center; gap: 12px; margin-bottom: 2rem; }
.prog-track { width: 240px; height: 3px; background: var(--border); border-radius: 999px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--text); border-radius: 999px; transition: width 0.4s; }
.prog-label { font-size: 12px; color: var(--muted); }

/* CONTROLS */
.controls-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.pill {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 400;
  padding: 5px 13px;
  border-radius: 999px;
  border: 0.5px solid var(--border-dark);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.12s;
}
.pill:hover { background: var(--border); color: var(--text); }
.pill.active { background: var(--text); color: #fff; border-color: var(--text); }
.sort-row { display: flex; gap: 6px; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; }
.sort-label { font-size: 11px; color: var(--faint); letter-spacing: 0.05em; }
.sort-row .pill.active { background: var(--border); color: var(--text); border-color: var(--border-dark); }
.meta-line { font-size: 12px; color: var(--faint); margin-bottom: 1rem; }

/* GRID */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }

/* CARD */
.card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.card:hover { border-color: var(--border-dark); }
.card.open { border-color: #aaa8a0; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
.card.done { opacity: 0.4; }

.card-head {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 1.1rem 1.2rem;
  cursor: pointer;
  user-select: none;
}
.card-head:hover, .card.open .card-head { background: #faf9f6; }

.check {
  width: 18px; height: 18px;
  border-radius: 5px;
  border: 1.5px solid var(--border-dark);
  flex-shrink: 0; margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.12s;
}
.check.on { background: var(--text); border-color: var(--text); }
.check.on::after {
  content: '';
  display: block;
  width: 5px; height: 9px;
  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(40deg) translateY(-1px);
}

.card-main { flex: 1; min-width: 0; }
.card-title { font-size: 13.5px; font-weight: 500; color: var(--text); line-height: 1.35; }
.card-tags { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.tag {
  font-size: 10.5px; padding: 2px 8px;
  border-radius: 999px; border: 0.5px solid;
  white-space: nowrap; font-weight: 400;
}
.t-cat { background: #f4f2ec; color: #555040; border-color: #d0ccbc; }
.t-free { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
.t-low { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-border); }
.t-easy { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
.t-med { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-border); }
.t-hard { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }
.t-wow { background: var(--tag-high-bg); color: var(--tag-high); border-color: var(--border-dark); font-weight: 500; }

.chev { font-size: 10px; color: var(--faint); transition: transform 0.2s; flex-shrink: 0; margin-top: 4px; }
.card.open .chev { transform: rotate(180deg); }

/* BODY */
.card-body { display: none; padding: 0 1.2rem 1.2rem; border-top: 0.5px solid var(--border); }
.card.open .card-body { display: block; }

.sec-label {
  font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--faint);
  margin: 1rem 0 6px;
}
.sec-label:first-child { margin-top: 1rem; }

.desc { font-size: 13px; color: #555; line-height: 1.7; }

.steps { list-style: none; display: flex; flex-direction: column; gap: 7px; }
.steps li { display: flex; gap: 8px; font-size: 13px; color: #555; line-height: 1.6; }
.step-n { font-size: 11px; color: var(--faint); min-width: 16px; margin-top: 2px; flex-shrink: 0; font-weight: 500; }

.rank-box {
  background: var(--bg);
  border-radius: 8px;
  padding: 8px 11px;
  font-size: 12px;
  color: #666;
  line-height: 1.6;
}

.tl-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.tl-track { flex: 1; height: 3px; background: var(--border); border-radius: 999px; overflow: hidden; }
.tl-fill { height: 100%; background: var(--border-dark); border-radius: 999px; }
.tl-label { font-size: 11px; color: var(--muted); min-width: 90px; text-align: right; white-space: nowrap; }

.res-btn {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; color: var(--blue);
  text-decoration: none;
  padding: 5px 11px;
  border: 0.5px solid var(--blue-border);
  border-radius: 8px;
  margin-top: 4px;
  transition: background 0.1s;
}
.res-btn:hover { background: var(--blue-bg); }

.empty { grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--faint); font-size: 14px; }
</style>
<!-- print styles + reduced motion -->
<style>
@media print {
  .topbar, .hamburger, .nav-overlay, .progress-rule, .footer-socials { display: none !important; }
  body { background: #fff !important; color: #000 !important; }
  a { color: #000 !important; text-decoration: underline; }
  img { max-width: 100% !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}
</style>
</head>

<div class="wrap">

<div class="hero">
  <div class="hero-eyebrow">Official · Verified · Minimal cost</div>

const CATS = ["All", ...new Set(DATA.map(d => d.cat))];
let activeC = "All", activeS = "def";
let checked = {};
try { const v = localStorage.getItem("top1k_cool_v1"); if (v) checked = JSON.parse(v); } catch(e) {}
function save() { try { localStorage.setItem("top1k_cool_v1", JSON.stringify(checked)); } catch(e) {} }

function costOrder(c) { return c === "f" ? 0 : 1; }
function diffOrder(d) { return d === "e" ? 0 : d === "m" ? 1 : 2; }

function getSorted(arr) {
  const a = [...arr];
  if (activeS === "cost") a.sort((x, y) => costOrder(x.cost) - costOrder(y.cost));
  else if (activeS === "diff") a.sort((x, y) => diffOrder(x.diff) - diffOrder(y.diff));
  else if (activeS === "time") a.sort((x, y) => x.yr - y.yr);
  return a;
}

function updateProgress() {
  const done = Object.values(checked).filter(Boolean).length;
  const pct = Math.round(done / DATA.length * 100);
  document.getElementById("pfill").style.width = pct + "%";
  document.getElementById("plbl").textContent = done + " / " + DATA.length + " done";
}

function render() {
  const filtered = activeC === "All" ? DATA : DATA.filter(d => d.cat === activeC);
  const sorted = getSorted(filtered);
  document.getElementById("mlbl").textContent = sorted.length + " pursuit" + (sorted.length !== 1 ? "s" : "");
  const grid = document.getElementById("grid");
  const openSet = new Set([...grid.querySelectorAll(".card.open")].map(c => +c.dataset.id));
  grid.innerHTML = "";
  if (!sorted.length) { grid.innerHTML = '<div class="empty">Nothing here, try a different filter.</div>'; return; }
  sorted.forEach(item => {
    const pct = Math.min(100, Math.round(item.yr / item.yrM * 100));
    const isDone = !!checked[item.id];
    const el = document.createElement("div");
    el.className = "card" + (openSet.has(item.id) ? " open" : "") + (isDone ? " done" : "");
    el.dataset.id = item.id;
    const diffC = item.diff === "e" ? "easy" : item.diff === "m" ? "med" : "hard";
    const costC = item.cost === "f" ? "free" : "low";
    const wowC = item.wow === "Extremely cool" ? "high" : "med";
    el.innerHTML = `
<div class="card-head">
  <div class="check${isDone ? " on" : ""}" data-cb="${item.id}"></div>
  <div class="card-main">
    <div class="card-title">${item.title}</div>
    <span class="tag t-wow" style="${wowC === "high" ? "" : "background:#f4f2ec;color:#555040;border-color:#d0ccbc"}">${item.wow}</span>
    <div class="card-tags">
      <span class="tag t-cat">${item.cat}</span>
      <span class="tag t-${costC}">${item.cL}</span>
      <span class="tag t-${diffC}">${item.dL}</span>
    </div>
  </div>
  <span class="chev">▼</span>
</div>
<div class="card-body">
  <div class="sec-label">What it is</div>
  <p class="desc">${item.desc}</p>
  <div class="sec-label">Step-by-step guide</div>
  <ul class="steps">${item.steps.map((s, i) => `<li><span class="step-n">${i+1}.</span><span>${s}</span></li>`).join("")}</ul>
  <div class="sec-label">Official ranking</div>
  <div class="rank-box">${item.rank}</div>
  <div class="sec-label">Time to top 1000</div>
  <div class="tl-row">
    <div class="tl-track"><div class="tl-fill" style="width:${pct}%"></div></div>
    <span class="tl-label">${item.time}</span>
  </div>
  <div class="sec-label">Best resource</div>
  <a class="res-btn" href="${item.res.u}" target="_blank">${item.res.l} →</a>
</div>`;
    el.querySelector(".card-head").addEventListener("click", e => {
      if (e.target.closest("[data-cb]")) return;
      el.classList.toggle("open");
    });
    el.querySelector("[data-cb]").addEventListener("click", e => {
      e.stopPropagation();
      checked[item.id] = !checked[item.id];
      save();
      el.classList.toggle("done", !!checked[item.id]);
      el.querySelector(".check").classList.toggle("on", !!checked[item.id]);
      updateProgress();
    });
    grid.appendChild(el);
  });
}

// Category buttons
const catBar = document.getElementById("catbar");
CATS.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "pill" + (cat === "All" ? " active" : "");
  btn.textContent = cat;
  btn.onclick = () => {
    activeC = cat;
    document.querySelectorAll("#catbar .pill").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  };
  catBar.appendChild(btn);
});

// Sort buttons
document.querySelectorAll(".sort-row button").forEach(btn => {
  btn.addEventListener("click", () => {
    activeS = btn.dataset.s;
    document.querySelectorAll(".sort-row button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
});

render();
updateProgress();
</script>
</body>
