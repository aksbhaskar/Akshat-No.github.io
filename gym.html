<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎧 Gym</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D0D;
  --surface:#161616;
  --surface2:#1E1E1E;
  --border:#2A2A2A;
  --border2:#333;
  --text:#F0EDE8;
  --muted:#888;
  --hint:#555;
  --accent:#C8A96E;
  --accent2:#8FBF9F;
  --red:#D97B6C;
  --blue:#7BA8C8;
  --purple:#9B89C4;
  --font-display:'Playfair Display',serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}
.header{padding:2.5rem 2rem 1.5rem;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem}
.header-left h1{font-family:var(--font-display);font-size:2rem;font-weight:400;letter-spacing:-0.01em;line-height:1}
.header-left h1 em{font-style:italic;color:var(--accent)}
.header-left p{font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--font-mono);letter-spacing:.06em}
.legend{display:flex;flex-wrap:wrap;gap:12px}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cal-wrap{padding:1.5rem 2rem 2rem}
.month-block{margin-bottom:2rem}
.month-label{font-family:var(--font-display);font-size:1.1rem;font-weight:400;letter-spacing:.04em;color:var(--muted);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:0.5px solid var(--border)}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.dow{text-align:center;font-size:10px;font-family:var(--font-mono);color:var(--hint);letter-spacing:.1em;text-transform:uppercase;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day-cell{border:0.5px solid var(--border);border-radius:8px;padding:8px 8px 7px;cursor:pointer;transition:all .15s ease;min-height:72px;position:relative;background:var(--surface)}
.day-cell:hover{border-color:var(--border2);background:var(--surface2);transform:translateY(-1px)}
.day-cell.empty{background:transparent;border-color:transparent;cursor:default}
.day-cell.empty:hover{transform:none}
.day-num{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-bottom:5px}
.day-cell.active-day .day-num{color:var(--accent);font-weight:500}
.day-type{font-size:10px;font-weight:500;margin-bottom:3px;line-height:1.3}
.day-sub{font-size:9.5px;color:var(--muted);line-height:1.4}
.day-cell.rest{opacity:.6}
.type-push .day-type{color:#D97B6C}
.type-pull .day-type{color:#7BA8C8}
.type-legs .day-type{color:#9B89C4}
.type-run .day-type{color:#C8A96E}
.type-core .day-type{color:#8FBF9F}
.type-rest .day-type{color:var(--hint)}
.type-race .day-type{color:#fff;font-size:11px}
.day-cell.type-race{background:#1A0D0A;border-color:#D97B6C}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border:0.5px solid var(--border2);border-radius:16px;width:100%;max-width:660px;max-height:90vh;overflow-y:auto;padding:0;position:relative}
.modal-header{padding:1.5rem 1.75rem 1.25rem;border-bottom:0.5px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;border-radius:16px 16px 0 0}
.modal-close{position:absolute;top:1.25rem;right:1.25rem;background:var(--surface2);border:0.5px solid var(--border2);color:var(--muted);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{color:var(--text);border-color:var(--muted)}
.modal-date{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:4px}
.modal-title{font-family:var(--font-display);font-size:1.4rem;font-weight:400}
.modal-body{padding:1.25rem 1.75rem 1.75rem}
.section{margin-bottom:1.5rem}
.section-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:0.5px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.exercise-row{display:grid;grid-template-columns:1fr auto auto;gap:0 16px;padding:7px 0;border-bottom:0.5px solid var(--border);align-items:start;font-size:13px}
.exercise-row:last-child{border-bottom:none}
.ex-name{font-weight:500;line-height:1.4}
.ex-note{font-size:11px;color:var(--muted);margin-top:2px;grid-column:1/-1}
.ex-sets{font-family:var(--font-mono);font-size:12px;color:var(--accent);white-space:nowrap}
.ex-reps{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.step-num{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--border2);text-align:center;line-height:18px;font-size:9px;font-family:var(--font-mono);color:var(--muted);margin-right:8px;flex-shrink:0}
/* MEAL TIMELINE */
.meal-timeline{position:relative;padding-left:16px}
.meal-timeline::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:0.5px;background:var(--border2)}
.meal-entry{position:relative;margin-bottom:14px}
.meal-dot{position:absolute;left:-14px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.meal-dot.highlight{background:var(--accent);width:9px;height:9px;left:-15px;top:4px}
.meal-dot.green{background:#8FBF9F}
.meal-card{border:0.5px solid var(--border);border-radius:8px;padding:10px 12px}
.meal-time-tag{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.08em;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center}
.meal-kcal{font-family:var(--font-mono);font-size:10px;color:var(--hint)}
.meal-name{font-size:13px;font-weight:500;margin-bottom:4px}
.meal-items{font-size:12px;color:var(--muted);line-height:1.75}
.meal-items strong{color:var(--text);font-weight:500}
.meal-note{font-size:11px;color:var(--hint);margin-top:5px;font-style:italic}
.totals-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.total-item{background:var(--surface2);border-radius:6px;padding:7px 8px;text-align:center}
.total-val{font-family:var(--font-mono);font-size:14px;font-weight:500}
.total-label{font-size:10px;color:var(--muted);margin-top:1px}
.note-box{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:12px;font-family:var(--font-mono);margin-right:4px;margin-bottom:4px;letter-spacing:.04em}
.tag-push{background:#3A1A16;color:#D97B6C}
.tag-pull{background:#142030;color:#7BA8C8}
.tag-run{background:#2A2010;color:#C8A96E}
.tag-core{background:#0E2018;color:#8FBF9F}
.tag-rest{background:#222;color:#666}
.tag-race{background:#3A0E08;color:#E8897A}
.race-banner{background:linear-gradient(135deg,#2A0E08,#1A0D16);border:0.5px solid #D97B6C;border-radius:10px;padding:1rem 1.2rem;margin-bottom:1rem;text-align:center}
.race-banner h3{font-family:var(--font-display);font-size:1.2rem;color:#E8897A;margin-bottom:4px}
.race-banner p{font-size:12px;color:var(--muted)}
.divider-label{font-size:10px;color:var(--accent);font-family:var(--font-mono);letter-spacing:.1em;text-transform:uppercase;padding:8px 0 2px;border-top:0.5px solid var(--border2);margin-top:4px}
</style>
<!-- print styles + reduced motion -->
<style>
@media print {
  .topbar, .hamburger, .nav-overlay, .progress-rule, .footer-socials { display: none !important; }
  body { background: #fff !important; color: #000 !important; }
  a { color: #000 !important; text-decoration: underline; }
  img { max-width: 100% !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Ashoka <em>Fitness</em> Calendar</h1>
    <p>May 15 – June 20, 2026 &nbsp;·&nbsp; 6'2" &nbsp;·&nbsp; 79 kg &nbsp;·&nbsp; Lean V-shape goal &nbsp;·&nbsp; Gym 7–9 PM</p>
  </div>
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#D97B6C"></div>Push</div>
    <div class="leg-item"><div class="leg-dot" style="background:#7BA8C8"></div>Pull + Arms</div>
    <div class="leg-item"><div class="leg-dot" style="background:#9B89C4"></div>Legs</div>
    <div class="leg-item"><div class="leg-dot" style="background:#8FBF9F"></div>Core</div>
    <div class="leg-item"><div class="leg-dot" style="background:#C8A96E"></div>Run</div>
    <div class="leg-item"><div class="leg-dot" style="background:#555"></div>Rest</div>
  </div>
</div>

<div class="cal-wrap" id="calWrap"></div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <button class="modal-close" onclick="closeOverlay()">✕</button>
      <div class="modal-date" id="mDate"></div>
      <div class="modal-title" id="mTitle"></div>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script>
// ─── WARMUPS & COOLDOWNS ────────────────────────────────────────────────────

const WARMUP_GYM = [
  {name:"Treadmill / brisk walk",sets:"",reps:"5–7 min",note:"Elevate HR gently before lifting. Not a run."},
  {name:"Arm circles (forward + backward)",sets:"",reps:"20 each way",note:"Shoulder joint prep, critical before pressing."},
  {name:"Band pull-aparts or light cable",sets:"",reps:"2 × 15",note:"Activates rear delts and rotator cuff."},
  {name:"Hip circles + leg swings",sets:"",reps:"10 each side",note:"Prep hips for all pushing and leg movements."},
];
const WARMUP_RUN = [
  {name:"Walk",sets:"",reps:"3 min",note:"Let the body transition slowly."},
  {name:"Leg swings, front/side",sets:"",reps:"10 each direction",note:"Hip flexor and hamstring prep."},
  {name:"High knees + butt kicks",sets:"",reps:"30 sec each",note:"Activate glutes and hip flexors before settling in."},
  {name:"Easy jog",sets:"",reps:"2 min",note:"Find your rhythm before committing to pace."},
];
const COOLDOWN_GYM = "5 min easy treadmill walk → chest doorway stretch 30s → lat hang/stretch 30s each side → quad stretch 30s each → shoulder cross-body 30s each. Total ~10 min.";
const COOLDOWN_RUN = "Walk 3–5 min until HR below 120 → calf stretch 30s each → hip flexor stretch 30s each → hamstring 30s each. Do NOT skip, prevents the tightness that ruins your next gym session.";

// ─── MEAL BUILDER ────────────────────────────────────────────────────────────
// Gym days: workout 7–9 PM. Dinner mess is 7–9 PM which overlaps.
// Strategy: eat dinner BEFORE gym (6:30 PM light meal), post-gym protein shake at 9 PM.
// Morning breakfast 7–9 AM (mess), lunch 1:30–2:30 PM (mess).

function mealCard(time, name, kcal, items, note, dotClass){
  const dot = dotClass || "";
  return `<div class="meal-entry">
    <div class="meal-dot ${dot}"></div>
    <div class="meal-card">
      <div class="meal-time-tag"><span>${time}</span>${kcal ? `<span class="meal-kcal">${kcal} kcal</span>` : ''}</div>
      <div class="meal-name">${name}</div>
      <div class="meal-items">${items}</div>
      ${note ? `<div class="meal-note">${note}</div>` : ''}
    </div>
  </div>`;
}

function totalsBar(kcal, protein, carbs, fat){
  return `<div class="totals-bar">
    <div class="total-item"><div class="total-val">${kcal}</div><div class="total-label">kcal</div></div>
    <div class="total-item"><div class="total-val" style="color:#7BA8C8">${protein}g</div><div class="total-label">protein</div></div>
    <div class="total-item"><div class="total-val" style="color:#C8A96E">${carbs}g</div><div class="total-label">carbs</div></div>
    <div class="total-item"><div class="total-val" style="color:#8FBF9F">${fat}g</div><div class="total-label">fat</div></div>
  </div>`;
}

// GYM DAY MEALS (workout 7–9 PM)
const MEALS_GYM = `<div class="meal-timeline">
${mealCard("7:00–8:00 AM, Breakfast (Mess)", "Oats + eggs + fruit", 520,
  "<strong>Option A:</strong> 80g rolled oats with low-fat milk + 3 boiled eggs + 1 banana<br><strong>Option B:</strong> 2 eggs + 100g paneer bhurji + 1 roti + 1 fruit<br>Black coffee (optional), no sugar",
  "Highest protein meal of the morning. Eggs from the mess egg station if available.", "highlight")}
${mealCard("11:00 AM, Mid-morning snack", "Nuts + fruit", 180,
  "20 almonds + 1 apple or orange<br><strong>Or:</strong> 1 banana + 1 tbsp peanut butter",
  "Keeps energy stable. Do not skip, long gap between breakfast and lunch.")}
${mealCard("1:30–2:30 PM, Lunch (Mess)", "High-protein mess plate", 680,
  "<strong>Carbs:</strong> 1 cup rice OR 2 chapati (not both)<br><strong>Protein:</strong> Dal + paneer OR egg curry, take double protein serving<br><strong>Sides:</strong> Sabzi of the day + salad if available<br><strong>Always:</strong> 1 bowl curd (protein + digestion)<br>Skip fried items (vada, pakora, etc.)",
  "Biggest meal of the day. Load up on protein here.", "highlight")}
${mealCard("4:30 PM, Afternoon snack", "Protein + slow carb", 280,
  "<strong>Option A:</strong> 200g low-fat curd + 1 fruit<br><strong>Option B:</strong> 2 boiled eggs on 1 roti<br><strong>Option C:</strong> 1 slice brown bread + 1.5 tbsp peanut butter<br><strong>Option D:</strong> 100g cottage cheese (paneer) plain",
  "Bridge between lunch and gym. Keeps blood sugar stable.")}
${mealCard("6:00–6:30 PM, Pre-gym dinner (Mess or room)", "Light carb + protein, pre-gym fuel", 420,
  "<strong>At mess:</strong> Dal + 1 chapati + sabzi + curd, eat light, not heavy<br><strong>Or in room:</strong> Banana + 2 boiled eggs + 1 roti<br>No heavy fried or oily food before gym, causes nausea",
  "Eat 60–90 min before gym. Light enough not to feel full during training.", "highlight")}
${mealCard("7:00–9:00 PM, GYM SESSION", "Train", null,
  "Sip 500ml water during session. Small snack optional at halftime if energy dips (½ banana).",
  "Do not train on empty. Do not train stuffed.", "green")}
${mealCard("9:00–9:30 PM, Post-gym (within 30 min)", "Protein shake, recovery window", 250,
  "<strong>1 scoop whey protein</strong> in 300ml water or low-fat milk<br>+ 1 banana (fast carbs to replenish glycogen)<br><strong>No solid meal needed</strong>, shake is sufficient here",
  "This is the most important nutrition timing of the day. Do not skip.", "highlight")}
${mealCard("10:30 PM, Before bed", "Casein protein (slow-release)", 160,
  "1 glass warm skimmed milk (200ml)<br><strong>Or:</strong> 150g low-fat curd<br>Optional: pinch of turmeric in milk",
  "Casein digests slowly, feeds muscles during sleep. Especially important after gym.")}
</div>
${totalsBar("~2490", "~165", "~230", "~60")}
<div class="note-box" style="margin-top:10px">Gym days total ~2490 kcal · 165g protein · 3L+ water · Note: dinner is split, light meal before gym at 6:30 PM, shake only after gym at 9 PM</div>`;

// RUN DAY MEALS (morning runs, assume early-mid morning)
const MEALS_RUN = `<div class="meal-timeline">
${mealCard("6:30–7:00 AM, Pre-run fuel (90 min before)", "Light carb + coffee", 320,
  "<strong>1 banana</strong> + 50g oats with water (not milk, lighter)<br>Black coffee optional (proven performance boost)<br>500ml water on waking",
  "Eat light. Heavy food causes stitch on long runs.", "highlight")}
${mealCard("~9:00 AM, Post-run recovery (within 30 min)", "Protein + fast carbs", 380,
  "<strong>1 scoop whey protein</strong> in water or milk<br>+ 1 banana or 1 apple<br>+ 500ml water with a pinch of salt (electrolytes)<br><strong>Or:</strong> Chocolate milk (250ml) if available, near-perfect recovery drink",
  "Glycogen window, carbs here go straight to muscle replenishment.", "highlight")}
${mealCard("10:30 AM, Snack", "Top up after run", 220,
  "10 almonds + 1 fruit<br>Or: 1 toast + peanut butter",
  "Hunger is high after a run. This prevents overeating at lunch.")}
${mealCard("1:30–2:30 PM, Lunch (Mess)", "Bigger carb lunch, run days need more fuel", 780,
  "<strong>Carbs:</strong> 1.5 cups rice OR 3 chapati, you earned extra carbs today<br><strong>Protein:</strong> Dal + paneer + egg (stack protein)<br><strong>Sides:</strong> Sabzi + salad + 1 bowl curd<br>Can take an extra chapati vs normal days",
  "Carb-up on run days. Your glycogen stores are depleted.", "highlight")}
${mealCard("4:30 PM, Snack", "Protein snack", 260,
  "<strong>Option A:</strong> 200g curd with honey + fruit<br><strong>Option B:</strong> 2 boiled eggs on 1 roti<br><strong>Option C:</strong> Peanut butter on brown bread",
  "Keeps protein synthesis going through the afternoon.")}
${mealCard("7:30–8:30 PM, Dinner (Mess), normal dinner on run days", "Standard protein dinner", 560,
  "<strong>Dal / rajma / chole</strong> + 1–2 chapati<br>Sabzi of the day<br>Egg or chicken if available at mess<br>1 bowl curd",
  "No gym tonight, eat dinner normally at mess.", "highlight")}
${mealCard("10:30 PM, Before bed", "Casein, overnight repair", 160,
  "1 glass warm skimmed milk<br>Or: 150g low-fat curd",
  "Running causes significant muscle micro-damage. Casein feeds repair overnight.")}
</div>
${totalsBar("~2680", "~155", "~295", "~58")}
<div class="note-box" style="margin-top:10px">Run days: ~2680 kcal (extra carbs for fuel) · Carry 750ml water on runs over 6 km · Long run days: add electrolytes (ORS sachet or pinch salt+sugar+lemon in water)</div>`;

// REST DAY MEALS
const MEALS_REST = `<div class="meal-timeline">
${mealCard("8:00–9:00 AM, Breakfast (Mess)", "Protein-first breakfast", 480,
  "<strong>Option A:</strong> 3 boiled eggs + 2 slices toast + 1 fruit + milk/tea<br><strong>Option B:</strong> Paneer bhurji + 2 roti + fruit<br><strong>Option C:</strong> Oats + milk + 2 boiled eggs on the side",
  "Sleep in slightly. Protein first even on rest days, muscles repair today.")}
${mealCard("11:30 AM, Mid-morning snack", "Light snack", 160,
  "Handful almonds (15–18) + 1 fruit<br>Or: 1 banana",
  "Smaller snack than gym/run days, lower activity today.")}
${mealCard("1:30–2:30 PM, Lunch (Mess)", "Balanced mess plate", 620,
  "<strong>Carbs:</strong> 1 cup rice OR 1–2 chapati<br><strong>Protein:</strong> Dal + paneer or eggs<br><strong>Sides:</strong> Sabzi + salad + curd<br>Keep portions moderate, you are not burning as much today",
  "Lower carbs than gym days. Protein stays the same.", "highlight")}
${mealCard("5:00 PM, Snack", "Light protein snack", 200,
  "<strong>Option A:</strong> 150g curd + fruit<br><strong>Option B:</strong> 1 boiled egg + 1 fruit<br><strong>Option C:</strong> Small handful nuts + tea",
  "Relaxed snack. No training to fuel so keep it light.")}
${mealCard("7:30–8:30 PM, Dinner (Mess)", "Light dinner, recovery day", 520,
  "<strong>Dal + 1–2 chapati</strong> + sabzi<br>Egg or chicken if available<br>1 bowl curd<br>Avoid oily/fried mess items today",
  "Smaller dinner than gym days, body needs less fuel when inactive.", "highlight")}
${mealCard("10:30 PM, Before bed", "Casein", 150,
  "1 glass warm milk or 150g low-fat curd",
  "Rest days are when muscle actually grows. Casein feeds that process overnight.")}
</div>
${totalsBar("~2130", "~140", "~195", "~55")}
<div class="note-box" style="margin-top:10px">Rest days: ~2130 kcal (controlled deficit) · 3L water still required · No skipping protein on rest days, muscle synthesis peaks 24–48 hrs after training</div>`;

// RACE EVE MEALS
const MEALS_RACE_EVE = `<div class="meal-timeline">
${mealCard("8:00 AM, Breakfast", "Normal protein breakfast", 520,
  "3 boiled eggs + 80g oats + 1 banana + milk<br>Nothing unusual, familiar foods only",
  "Eat what you always eat. Race eve is not the time to try new foods.")}
${mealCard("11:00 AM, Snack", "Small carb snack", 180,
  "1 banana + handful almonds",
  "Keep grazing. Stay hydrated all day.")}
${mealCard("1:30 PM, Lunch (Mess)", "Carb-load lunch", 820,
  "<strong>Rice, 1.5–2 cups</strong> (more than normal)<br>Dal + paneer (protein)<br>Sabzi + curd<br>Extra chapati if available<br>No raw salad tonight, avoid anything that causes bloating",
  "Main carb-load meal. Rice is best, easy to digest, loads glycogen.", "highlight")}
${mealCard("4:30 PM, Snack", "Banana + toast", 250,
  "2 slices toast with butter/peanut butter + 1 banana<br>500ml water",
  "Topping up glycogen. Eat more than usual today, it all gets used tomorrow.")}
${mealCard("6:30–7:00 PM, Early carb-load dinner", "Pasta / rice + protein, race eve special", 880,
  "<strong>Best option:</strong> Rice or pasta (if mess has it) + dal + paneer/chicken<br>2–3 chapati if rice unavailable<br>Avoid: raw vegetables, spicy food, anything fried, dairy-heavy dishes<br>1 banana + 1 glass milk before bed",
  "Eat early. Bed by 10:30 PM. Lay out your race kit tonight.", "highlight")}
${mealCard("10:00 PM, Pre-sleep", "Milk + banana", 180,
  "1 glass warm milk + 1 banana<br>Then sleep, 8 hours minimum",
  "Final glycogen top-up. No late night. No screens after 10:30 PM.")}
</div>
${totalsBar("~2830", "~145", "~380", "~55")}
<div class="note-box" style="margin-top:10px">Race eve: ~2830 kcal (carb-load, intentionally higher) · Drink 3L+ water today · No alcohol · Bed by 10:30 PM without exception</div>`;

// RACE DAY MEALS
const MEALS_RACE = `<div class="meal-timeline">
${mealCard("Race morning, 90 min before start", "Pre-race fuel", 400,
  "<strong>70g oats</strong> with water (not milk, lighter on stomach)<br>1 banana<br>500ml water<br>Coffee optional (proven race-day boost, only if you drink it regularly)",

${mealCard("During race, every 3–4 km", "On-course hydration + fuel", null,

function makePush(week){
  const w12 = week <= 2;
  const sets = w12 ? 3 : 4;
  const reps1 = w12 ? "10–12" : "8–10";
  const reps2 = w12 ? "13–15" : "12";
  const ex = [
    {name:"Incline dumbbell press",sets:`${sets}`,reps:reps1,note:"Upper chest = V-shape width. 30–45° bench. Slow 3-sec descent, explosive up."},
    {name:"Flat bench press",sets:`${sets}`,reps:reps1,note:"Compound base. Full range. Do not bounce off chest."},
    {name:"Cable chest fly",sets:"3",reps:reps2,note:"Cross-cable. Pause 1 sec at centre, feel the chest contracting, not the arms."},
    {name:"Seated dumbbell shoulder press",sets:`${sets}`,reps:reps1,note:"Broader shoulders = narrower-looking waist. Control the descent."},
    {name:"Lateral raises",sets:"4",reps:"15",note:"THE V-shape exercise. Light weight, slow full arc to shoulder height. No shrugging."},
    {name:"Rear delt fly (bent-over DB or pec-deck reverse)",sets:"3",reps:"15",note:"Fixes rounded shoulders. Most beginners skip this. Non-negotiable."},
    {name:"Tricep pushdown (cable, rope or bar)",sets:"3",reps:"12–15",note:"Elbows pinned to sides. Triceps = 2/3 of your upper arm size."},
    ...(w12
      ? [{name:"Overhead tricep extension (rope or DB)",sets:"2",reps:"12",note:"Long head. Makes arm look full from behind."}]
      : [{name:"Skull crushers (EZ bar)",sets:"3",reps:"10",note:"Mass builder, add in week 3. Strict elbows."},
         {name:"Farmer carry finisher",sets:", ",reps:"40m × 4",note:"Heaviest DBs you can carry. Forearm + grip + posture. End of session only."}]),
  ];
  return {warmup:WARMUP_GYM, exercises:ex, cooldown:COOLDOWN_GYM, meals:MEALS_GYM,
    note: w12
      ? "Gym time: 7–9 PM. Eat your pre-gym dinner by 6:30 PM. Rest 60–90 sec between sets. First gym sessions, start lighter than you think. Log every weight used."
      : "Rest 90 sec on compounds, 60 sec on isolation. You should be meaningfully stronger than week 1. If not, check sleep and protein."};
}

const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function renderCal(){
  const months = [
    {year:2026, month:4, label:"May 2026", startDay:15, endDay:31},
    {year:2026, month:5, label:"June 2026", startDay:1, endDay:20},
  ];
  const wrap = document.getElementById("calWrap");
  months.forEach(m => {
    const block = document.createElement("div");
    block.className = "month-block";
    const label = document.createElement("div");
    label.className = "month-label";
    label.textContent = m.label;
    block.appendChild(label);
    const dowRow = document.createElement("div");
    dowRow.className = "dow-row";
    dayNames.forEach(d => {
      const el = document.createElement("div");
      el.className = "dow";
      el.textContent = d;
      dowRow.appendChild(el);
    });
    block.appendChild(dowRow);
    const grid = document.createElement("div");
    grid.className = "cal-grid";
    const first = new Date(m.year, m.month, 1);
    const firstDow = first.getDay();
    for(let i = 0; i < firstDow; i++){
      const e = document.createElement("div");
      e.className = "day-cell empty";
      grid.appendChild(e);
    }
    const daysInMonth = new Date(m.year, m.month+1, 0).getDate();
    for(let d = 1; d <= daysInMonth; d++){
      const cell = document.createElement("div");
      const mm = String(m.month+1).padStart(2,"0");
      const dd = String(d).padStart(2,"0");
      const key = `${m.year}-${mm}-${dd}`;
      const inRange = d >= m.startDay && d <= m.endDay;
      if(!inRange){
        cell.className = "day-cell rest";
        const dn = document.createElement("div");
        dn.className = "day-num";
        dn.textContent = d;
        cell.appendChild(dn);
        grid.appendChild(cell);
        continue;
      }
      const dayData = schedule[key];
      if(dayData){
        cell.className = `day-cell type-${dayData.type} active-day`;
        cell.onclick = () => openDay(key);
        const dn = document.createElement("div");
        dn.className = "day-num";
        dn.textContent = d;
        cell.appendChild(dn);
        const dt = document.createElement("div");
        dt.className = "day-type";
        dt.textContent = dayData.title;
        cell.appendChild(dt);
        const ds = document.createElement("div");
        ds.className = "day-sub";
        ds.textContent = dayData.subtitle;
        cell.appendChild(ds);
      } else {
        cell.className = "day-cell active-day";
        cell.style.opacity = "0.4";
        const dn = document.createElement("div");
        dn.className = "day-num";
        dn.textContent = d;
        cell.appendChild(dn);
      }
      grid.appendChild(cell);
    }
    block.appendChild(grid);
    wrap.appendChild(block);
  });
}

function formatDate(key){
  const [y,m,d] = key.split("-");
  const date = new Date(+y, +m-1, +d);
  return date.toLocaleDateString("en-GB",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}

function openDay(key){
  const data = schedule[key];
  if(!data) return;
  document.getElementById("mDate").textContent = formatDate(key).toUpperCase();
  document.getElementById("mTitle").textContent = data.title;
  const p = data.plan;
  let html = "";
  const tagMap = {push:"tag-push",pull:"tag-pull",legs:"tag-push",core:"tag-core",run:"tag-run",rest:"tag-rest",race:"tag-race"};
  html += `<div style="margin-bottom:1rem"><span class="tag ${tagMap[data.type]||'tag-rest'}">${data.subtitle}</span></div>`;
  if(data.type === "race"){
    html += `<div class="race-banner"><h3>Half Marathon, 21.1 km</h3><p>This is the event you have been training for since Day 1</p></div>`;
  }
  if(p.warmup && p.warmup.length){
    html += `<div class="section"><div class="section-label">Warm-up, do not skip</div>`;
    p.warmup.forEach((ex,i) => {
      html += `<div class="exercise-row">
        <div><span class="step-num">${i+1}</span><span class="ex-name">${ex.name}</span><div class="ex-note">${ex.note||''}</div></div>
        <div class="ex-sets">${ex.sets}</div>
        <div class="ex-reps">${ex.reps}</div>
      </div>`;
    });
    html += `</div>`;
  }
  if(p.exercises && p.exercises.length){
    html += `<div class="section"><div class="section-label">Main session, in order</div>`;
    let exNum = 1;
    p.exercises.forEach(ex => {
      if(ex.name.startsWith(", ")){
        html += `<div class="divider-label">${ex.name}</div>`;
        return;
      }
      html += `<div class="exercise-row">
        <div><span class="step-num">${exNum++}</span><span class="ex-name">${ex.name}</span><div class="ex-note">${ex.note||''}</div></div>
        <div class="ex-sets">${ex.sets}</div>
        <div class="ex-reps">${ex.reps}</div>
      </div>`;
    });
    html += `</div>`;
  }
  if(p.cooldown){
    html += `<div class="section"><div class="section-label">Cool-down</div><div class="note-box">${p.cooldown}</div></div>`;
  }
  if(p.note){
    html += `<div class="section"><div class="section-label">Coach's note</div><div class="note-box" style="border-left:2px solid var(--accent);border-radius:0 8px 8px 0;padding-left:14px">${p.note}</div></div>`;
  }
  if(p.meals){
    html += `<div class="section"><div class="section-label">Full day nutrition, timed to your Ashoka schedule</div>${p.meals}</div>`;
  }
  document.getElementById("mBody").innerHTML = html;
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeOverlay(){
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
}
function closeModal(e){
  if(e.target === document.getElementById("overlay")) closeOverlay();
}
document.addEventListener("keydown", e => { if(e.key === "Escape") closeOverlay(); });

renderCal();
</script>
</body>
</html>
