<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
  :root { --bg: #fff; --ink: #111; --muted: #888; --line: #ccc; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 18px/1.7 "Newsreader", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 14vh 20px 10vh; }
  h1 { font-size: 18px; font-weight: 400; margin: 0; }
  .site { margin: 0 0 24px; }
  h2 { font-size: 18px; font-weight: 400; color: var(--muted); margin: 0; }
  section { margin: 0 0 32px; }
  p { margin: 0; }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-color: var(--ink); }
  .gh { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 2px; }
  .gh-count { margin-top: 8px; }
  .pond-wrap { margin-bottom: 36px; }
  .intro { margin: 0 0 48px; }
  .intro p + p { margin-top: 16px; }
  .exp + .exp { margin-top: 14px; }
  .t { white-space: nowrap; }
  .d { color: var(--muted); }
  h3 { font-size: 18px; font-weight: 400; color: var(--muted); margin: 0 0 4px; }
  .scholar { margin-top: 20px; }
  .sub { margin-top: 26px; }
  #pond { display: block; width: 80%; height: 264px; margin: 0 auto; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent; }
  @media (max-width: 520px) { #pond { height: 216px; } }
  .gh i { display: block; aspect-ratio: 1; border-radius: 1px; background: color-mix(in srgb, var(--ink) 7%, var(--bg)); }
  .gh i.pad { visibility: hidden; }
  .gh i.l1 { background: color-mix(in srgb, var(--ink) 25%, var(--bg)); }
  .gh i.l2 { background: color-mix(in srgb, var(--ink) 45%, var(--bg)); }
  .gh i.l3 { background: color-mix(in srgb, var(--ink) 70%, var(--bg)); }
  .gh i.l4 { background: var(--ink); }
  /* navbar: a quiet column on the left, centred vertically; a row at the top on narrow screens */
  .side { position: fixed; top: 50%; transform: translateY(-50%); left: max(20px, calc(50% - 280px - 190px)); width: 150px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
  .side a { color: var(--muted); text-decoration: none; width: fit-content; transition: color .15s ease; }
  .side a:hover, .side a[aria-current="page"] { color: var(--ink); }
  .side a[aria-current="page"] { text-decoration: underline; text-decoration-color: var(--line); }
  @media (max-width: 960px) {
    .side { position: static; transform: none; width: auto; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 4px 18px; padding: 16px 20px 0; font-size: 16px; }
    main { padding-top: 8vh; }
  }
</style>
</head>
<body>
<nav class="side" aria-label="Pages">
  <a href="alternate.html">About</a>
  <a href="alternate-research.html">Research</a>
  <a href="alternate-experience.html">Experience</a>
  <a href="alternate-recognition.html">Recognition</a>
  <a href="alternate-contact.html" aria-current="page">Contact</a>
</nav>
<main>
  <h1>Contact</h1>
  <p class="site"><a href="/">Akshat Bhaskar</a></p>

  <section>
    <p>
      <a href="https://calendly.com/akshatbhaskar/30min">Book a Call</a>,
      <a href="mailto:bhaskarakshat22@gmail.com">Email</a>,
      <a href="https://x.com/aksbhaskar">Twitter</a>,
      <a href="https://www.linkedin.com/in/aksbhaskar/">LinkedIn</a>,
      <a href="https://github.com/aksbhaskar">GitHub</a>
    </p>
  </section>

  <section id="gh-section">
    <div class="gh" id="gh" aria-hidden="true"></div>
    <p class="gh-count"><a href="https://github.com/aksbhaskar" id="gh-count">Contributions</a></p>
  </section>

</main>
<script>
  (function () {
    var grid = document.getElementById("gh"), count = document.getElementById("gh-count");
    fetch("https://github-contributions-api.jogruber.de/v4/aksbhaskar?y=last", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (data) {
        var days = data.contributions || [];
        if (!days.length) throw 0;
        var total = data.total && data.total.lastYear != null ? data.total.lastYear
          : days.reduce(function (n, d) { return n + d.count; }, 0);
        count.textContent = "contributions in the last year: " + total.toLocaleString("en-US");
        var pad = new Date(days[0].date + "T00:00:00").getDay();
        grid.style.gridTemplateColumns = "repeat(" + Math.ceil((days.length + pad) / 7) + ", 1fr)";
        var html = "";
        for (var i = 0; i < pad; i++) html += '<i class="pad"></i>';
        days.forEach(function (d) {
          html += '<i class="l' + d.level + '" title="' + d.count + " on " + d.date + '"></i>';
        });
        grid.innerHTML = html;
      })
      .catch(function () { grid.style.display = "none"; });
  })();
</script>
</body>
</html>
