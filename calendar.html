<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar · Akshat Bhaskar</title>
<meta name="description" content="Akshat Bhaskar's public calendar. Click any empty time to book a 30 minute Coffee Chat.">
<meta property="og:type" content="website">
<meta property="og:title" content="Calendar">
<meta property="og:description" content="Click any empty time to book a 30 minute Coffee Chat with me.">
<meta property="og:url" content="https://akshatb.com/calendar">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://akshatb.com/calendar">
<link rel="icon" type="image/jpeg" href="images/akshat.jpg">
<link rel="apple-touch-icon" sizes="180x180" href="images/icon-180.png">
<meta name="theme-color" content="#191919">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #191919; --side: #202020; --line: #2a2a2a; --line2: #333; --ink: #e9e9e7; --ink2: #b4b4b0; --muted: #7f7f7c; --hover: rgba(255,255,255,.06); --hover2: rgba(255,255,255,.1);
    --red: #eb5545; --blue: #2383e2;
    --row: 48px; --gutter: 64px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 13px/18px Inter, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .ib { width: 30px; height: 30px; border: 0; border-radius: 6px; background: none; color: var(--ink2); display: grid; place-items: center; flex: none; }
  .ib:hover { background: var(--hover); color: var(--ink); }
  .btn { height: 30px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 7px; background: #232323; color: var(--ink); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: #2a2a2a; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  /* sidebar */
  aside { width: 240px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; transition: margin-left .2s ease; }
  body.noside aside { margin-left: -240px; }
  .side-top { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
  .side-top div { display: flex; gap: 2px; }
  .mini { padding: 6px 10px 12px; user-select: none; }
  .mini-nav { display: flex; justify-content: flex-end; gap: 2px; margin-bottom: 4px; }
  .mini-nav .ib { width: 24px; height: 24px; }
  .mini-nav svg.i { width: 15px; height: 15px; }
  .mini-title { font-weight: 600; font-size: 13px; padding-left: 4px; margin-right: auto; align-self: center; }
  .mini table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .mini th { font-weight: 500; font-size: 11px; color: var(--muted); height: 24px; }
  .mini td { text-align: center; height: 28px; padding: 0; }
  .mini td.wk { color: #5a5a58; font-size: 10px; }
  .mini tr.cur td:not(.wk) { background: #2b2b2b; }
  .mini tr.cur td:nth-child(2) { border-radius: 6px 0 0 6px; }
  .mini tr.cur td:last-child { border-radius: 0 6px 6px 0; }
  .mini td button { width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; padding: 0; font-weight: 500; font-size: 12px; }
  .mini td button:hover { background: var(--hover2); }
  .mini td button.out { color: #5a5a58; }
  .mini td button.today { background: var(--red); color: #fff; }
  .rowlink { display: flex; align-items: center; gap: 10px; margin: 2px 8px; padding: 6px 8px; border-radius: 6px; color: var(--ink); font-weight: 500; border: 0; background: none; width: calc(100% - 16px); text-align: left; }
  .rowlink:hover { background: var(--hover); }
  .rowlink span { flex: 1; }
  .rowlink .i { color: var(--ink2); }
  .who { margin: 6px 10px 10px; display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 32px; background: #2a2a2a; border-radius: 6px; color: var(--muted); }
  .cals { flex: 1; overflow: auto; padding: 4px 8px 12px; }
  .cals h2 { font-size: 12px; font-weight: 500; color: var(--muted); margin: 6px 8px 4px; }
  .cals label { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-weight: 500; }
  .cals label:hover { background: var(--hover); }
  .cals input { appearance: none; -webkit-appearance: none; margin: 0; width: 14px; height: 14px; border-radius: 4px; background: var(--c); border: 2px solid var(--c); cursor: pointer; flex: none; }
  .cals input:not(:checked) { background: transparent; }
  .note { margin: 14px 8px 0; color: var(--muted); font-size: 12px; line-height: 17px; }
  .note a { color: var(--ink2); }

  /* main */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { height: 44px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 10px 0 16px; flex: none; }
  .top .me { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; margin-right: 6px; }
  .top .showside { margin-right: auto; display: none; }
  body.noside .top .showside { display: grid; }
  .view { position: relative; }
  .menu { position: absolute; top: 36px; right: 0; background: #252525; border: 1px solid var(--line2); border-radius: 8px; padding: 4px; min-width: 150px; z-index: 30; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .menu.on { display: block; }
  .menu button { display: flex; justify-content: space-between; width: 100%; border: 0; background: none; padding: 6px 10px; border-radius: 5px; text-align: left; }
  .menu button:hover { background: var(--hover2); }
  .menu kbd { font: inherit; color: var(--muted); }
  .heading { display: flex; align-items: baseline; gap: 10px; padding: 2px 20px 10px; flex: none; }
  .heading h1 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -.2px; }
  .heading span { color: var(--muted); font-weight: 600; font-size: 13px; }

  .days { display: flex; flex: none; padding-right: var(--sb, 0px); border-bottom: 1px solid var(--line); }
  .tz { width: var(--gutter); flex: none; color: var(--muted); font-size: 10px; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px 6px 0; }
  .hwrap, .cwrap { flex: 1; min-width: 0; overflow: hidden; position: relative; }
  .cwrap { height: 100%; }
  .track { display: flex; height: 100%; will-change: transform; }
  .dh { flex: 1; min-width: 0; height: 34px; display: flex; align-items: center; justify-content: center; gap: 5px; color: var(--ink2); font-weight: 500; font-size: 13px; border: 0; background: none; padding: 0 0 6px; }
  .dh:hover { color: var(--ink); }
  .dh.past { color: var(--muted); }
  .dh.today { color: var(--ink); font-weight: 600; }
  .dh b { font-weight: 600; }
  .dh.today b { background: var(--red); color: #fff; border-radius: 5px; padding: 0 5px; line-height: 20px; }

  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-color: #3a3a3a transparent; }
  .grid { display: flex; position: relative; height: calc(var(--row) * 24); }
  .hours { width: var(--gutter); flex: none; position: relative; }
  .hours span { position: absolute; right: 10px; transform: translateY(-7px); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .col { flex: 1; min-width: 0; position: relative; border-left: 1px solid var(--line); touch-action: pan-y;
    background: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--row) - 1px), var(--line) calc(var(--row) - 1px), var(--line) var(--row)); }
  .nowline { position: absolute; left: var(--gutter); right: 0; height: 1px; background: rgba(235,85,69,.45); z-index: 4; pointer-events: none; }
  .nowline.today { height: 2px; background: var(--red); z-index: 5; }
  .hours .nowpill { position: absolute; right: 4px; transform: translateY(-50%); background: var(--red); color: #fff; font-size: 11px; font-weight: 600; border-radius: 5px; padding: 0 5px; line-height: 18px; z-index: 6; font-variant-numeric: tabular-nums; }

  .ev { position: absolute; left: 2px; right: 6px; border-radius: 5px; padding: 3px 7px 3px 8px; overflow: hidden; background: var(--eb); color: var(--et); border-left: 3px solid var(--ec); font-size: 12px; line-height: 15px; font-weight: 500; white-space: nowrap; }
  .ev .t { display: block; overflow: hidden; text-overflow: ellipsis; }
  .ev .s { display: block; color: var(--es); font-weight: 400; font-size: 11px; font-variant-numeric: tabular-nums; }
  .ev.short { padding-top: 1px; padding-bottom: 1px; display: flex; gap: 6px; align-items: center; }
  .ev.short .t { flex: 0 1 auto; }
  .ev.short .s { display: inline; flex: none; }
  .ev.past { opacity: .45; }
  .ev.busy { --eb: #253642; --et: #9ec3dd; --ec: #4e86b0; --es: #6f93ad; cursor: not-allowed; }
  .ev.sleep { --eb: #2d2a42; --et: #b8aef2; --ec: #7a6ad6; --es: #857cb8; cursor: not-allowed; }
  .ev.off, .ev.weekend { --eb: #222; --et: #8c8c89; --ec: #3c3c3a; --es: #6c6c69; cursor: not-allowed; }
  .ev.mine { --eb: #263a2a; --et: #9fd2a5; --ec: #4f9a5a; --es: #79a982; }
  .ev.draft { --eb: #5a2620; --et: #fff; --ec: var(--red); --es: #f2b5ad; z-index: 7; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.45); }

  .bar { position: absolute; top: 0; left: 0; right: 0; height: 2px; overflow: hidden; z-index: 8; opacity: 0; transition: opacity .2s; }
  .bar.on { opacity: 1; }
  .bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 35%; background: var(--blue); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { left: -35%; } to { left: 100%; } }

  /* booking popover */
  .card { position: fixed; z-index: 40; width: 340px; max-width: calc(100vw - 16px); background: #252525; border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 16px 48px rgba(0,0,0,.55); padding: 14px 14px 12px; display: none; }
  .card.on { display: block; }
  .card-head { display: flex; align-items: flex-start; gap: 10px; }
  .card-head .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--red); margin-top: 6px; flex: none; }
  .card h3 { margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; flex: 1; }
  .card .ib { width: 26px; height: 26px; margin: -4px -4px 0 0; }
  .meta { display: grid; gap: 6px; margin: 10px 0 12px; color: var(--ink2); }
  .meta div { display: flex; gap: 10px; align-items: center; }
  .meta .i { width: 15px; height: 15px; color: var(--muted); }
  .card input, .card textarea { width: 100%; background: #1c1c1c; border: 1px solid #383838; border-radius: 6px; padding: 7px 10px; color: var(--ink); font: inherit; outline: none; margin-bottom: 8px; }
  .card input:focus, .card textarea:focus { border-color: var(--blue); }
  .card textarea { resize: vertical; min-height: 54px; }
  .card ::placeholder { color: #6b6b68; }
  .card-foot { display: flex; align-items: center; gap: 10px; }
  .save { height: 30px; padding: 0 14px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font-weight: 600; margin-left: auto; flex: none; }
  .save:hover { background: #1a73cf; }
  .save:disabled { opacity: .55; cursor: default; }
  .msg { font-size: 12px; line-height: 16px; color: var(--ink2); margin: 0; }
  .msg.err { color: #f08a7e; }
  .msg a { color: #7cb8f2; }
  .done { margin: 0; color: var(--ink2); display: none; }
  .card.ok .done { display: block; }
  .card.ok form, .card.ok .meta .fieldrow { display: none; }

  .snack { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #2d2d2d; border: 1px solid var(--line2); color: var(--ink); border-radius: 8px; padding: 9px 14px; display: none; gap: 14px; align-items: center; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.45); max-width: calc(100vw - 32px); }
  .snack.on { display: flex; }
  .snack button { border: 0; background: none; color: #7cb8f2; font-weight: 600; padding: 0; }

  @media (max-width: 900px) {
    aside { position: fixed; top: 0; bottom: 0; left: 0; z-index: 35; box-shadow: 0 0 30px rgba(0,0,0,.6); }
    body:not(.openside) aside { margin-left: -260px; box-shadow: none; }
    .top .showside { display: grid; }
    :root { --gutter: 52px; }
    .tz { font-size: 9px; padding-right: 4px; white-space: nowrap; }
  }
  @media (max-width: 560px) {
    .heading { padding: 0 14px 8px; }
    .heading h1 { font-size: 19px; }
    .top .me { display: none; }
    .card { left: 8px !important; right: 8px; top: auto !important; bottom: 8px; width: auto; }
  }
</style>
</head>
<body>
<aside>
  <div class="side-top">
    <button class="ib" id="hideSide" aria-label="Hide sidebar"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    <div><button class="ib" id="newBtn" aria-label="Book a Coffee Chat" title="Book the next free time"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div>
  </div>
  <div class="mini">
    <div class="mini-nav">
      <span class="mini-title" id="miniTitle"></span>
      <button class="ib" id="miniPrev" aria-label="Previous month"><svg class="i" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg></button>
      <button class="ib" id="miniNext" aria-label="Next month"><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <table id="miniGrid"></table>
  </div>
  <button class="rowlink" id="schedBtn"><svg class="i" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span>Book a Coffee Chat</span></button>
  <div class="who"><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Meet with Akshat</div>
  <div class="cals">
    <h2>bhaskarakshat22@gmail.com</h2>
    <label style="--c:#4e86b0"><input type="checkbox" data-kind="busy" checked>Busy</label>
    <label style="--c:#7a6ad6"><input type="checkbox" data-kind="sleep" checked>Sleeping</label>
    <p class="note">The empty spaces are when I’m free. Click or drag on one to book a 30 minute Coffee Chat on Google Meet. Times are in your time zone.<br><br>Prefer email? <a href="mailto:bhaskarakshat22@gmail.com">bhaskarakshat22@gmail.com</a></p>
  </div>
</aside>

<main>
  <div class="top">
    <button class="ib showside" id="showSide" aria-label="Show sidebar"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    <a href="/" aria-label="Akshat Bhaskar's website"><img class="me" src="images/akshat.jpg" alt=""></a>
    <div class="view">
      <button class="btn" id="viewBtn" aria-haspopup="true" aria-expanded="false"><span id="viewName">Week</span><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu" id="viewMenu" role="menu">
        <button role="menuitem" data-view="1">Day <kbd>D</kbd></button>
        <button role="menuitem" data-view="4">4 days <kbd>X</kbd></button>
        <button role="menuitem" data-view="7">Week <kbd>W</kbd></button>
      </div>
    </div>
    <button class="btn" id="todayBtn">Today</button>
    <button class="ib" id="prevBtn" aria-label="Previous"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="ib" id="nextBtn" aria-label="Next"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <div class="heading"><h1 id="title"></h1><span id="weekNo"></span></div>
  <div class="days" id="days"></div>
  <div class="scroll" id="scroll">
    <div class="bar" id="bar"></div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<div class="card" id="card" role="dialog" aria-labelledby="cardTitle">
  <div class="card-head">
    <span class="dot"></span>
    <h3 id="cardTitle">Coffee Chat with Akshat</h3>
    <button class="ib" id="cardClose" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="meta">
    <div><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="cardWhen"></span></div>
    <div class="fieldrow"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-4v12l-6-4"/></svg>Google Meet, link sent with the invite</div>
  </div>
  <form id="bookForm" novalidate>
    <input name="name" placeholder="Your name" autocomplete="name" aria-label="Your name">
    <input name="email" type="email" placeholder="Your email" autocomplete="email" aria-label="Your email">
    <textarea name="notes" rows="2" placeholder="What would you like to talk about?" aria-label="What would you like to talk about?"></textarea>
    <div class="card-foot"><p class="msg" id="cardMsg" aria-live="polite"></p><button class="save" id="saveBtn" type="submit">Book</button></div>
  </form>
  <p class="done" id="cardDone"></p>
</div>

<div class="snack" id="snack" role="status"><span id="snackText"></span><button id="snackBtn" hidden>Retry</button></div>

<script>
(function () {
  var USER = 'aksbhaskar', EVENT = '30mins', LEN = 30, HOME = 'Asia/Kolkata';
  var API = 'https://api.cal.com/v2';
  var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  tz = ({ 'Asia/Calcutta': 'Asia/Kolkata', 'Asia/Katmandu': 'Asia/Kathmandu', 'Asia/Saigon': 'Asia/Ho_Chi_Minh', 'Asia/Rangoon': 'Asia/Yangon' })[tz] || tz;
  var CELL = LEN * 6e4;
  var $ = function (id) { return document.getElementById(id); };

  var view = innerWidth < 900 ? 4 : 7;
  function sunday(d) { return addDays(d, -d.getDay()); }
  var anchor = view === 7 ? sunday(startOfDay(new Date())) : startOfDay(new Date());   // first visible day
  var off = 0, snapT = null;   // sideways swipe offset in px
  var miniMonth = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  var show = { busy: true, sleep: true, off: true };
  var cache = {}, fetched = {}, booked = {}, picked = null;

  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())), day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
  }
  function rangeStart() { return anchor; }
  function visibleDays() { var s = rangeStart(), out = []; for (var i = 0; i < view; i++) out.push(addDays(s, i)); return out; }

  function hhmm(d) { return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function span(a, b) { return hhmm(a) + '–' + (b.getHours() === 0 && b.getMinutes() === 0 ? '24:00' : hhmm(b)); }
  function gmtLabel() {
    var off = -new Date().getTimezoneOffset(), s = off >= 0 ? '+' : '-'; off = Math.abs(off);
    return 'GMT' + s + Math.floor(off / 60) + (off % 60 ? ':' + String(off % 60).padStart(2, '0') : '');
  }

  /* what Akshat is doing at a moment, judged on his clock in India */
  var homeFmt = new Intl.DateTimeFormat('en-US', { timeZone: HOME, hour: 'numeric', minute: 'numeric', weekday: 'short', hourCycle: 'h23' });
  function homeParts(ms) { var p = {}; homeFmt.formatToParts(new Date(ms)).forEach(function (x) { p[x.type] = x.value; }); return { h: +p.hour % 24, m: +p.minute, wd: p.weekday }; }
  function kindAt(ms, freeSet) {
    if (freeSet[ms]) return 'free';
    var p = homeParts(ms), h = p.h + p.m / 60;
    if (h < 6.5) return 'sleep';
    return 'busy';
  }
  var LABEL = { busy: 'Busy', sleep: 'Sleep', off: 'Busy', weekend: 'Weekend' };

  /* availability from cal.com */
  function load() {
    var days = visibleDays(), s = sunday(addDays(days[0], -1)), e = addDays(sunday(addDays(days[days.length - 1], 1)), 6), key = ymd(s) + '_' + ymd(e);
    if (fetched[key] === 'ok' || fetched[key] === 'loading') return;
    fetched[key] = 'loading'; $('bar').classList.add('on');
    fetch(API + '/slots?username=' + USER + '&eventTypeSlug=' + EVENT + '&start=' + ymd(s) + '&end=' + ymd(e) + '&timeZone=' + encodeURIComponent(tz), { headers: { 'cal-api-version': '2024-09-04' } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        for (var d = s; d <= e; d = addDays(d, 1)) cache[ymd(d)] = cache[ymd(d)] || [];
        Object.keys(j.data || {}).forEach(function (k) {
          j.data[k].forEach(function (x) { var t = new Date(x.start).getTime(), dk = ymd(new Date(t)); (cache[dk] = cache[dk] || []); if (cache[dk].indexOf(t) < 0) cache[dk].push(t); });
        });
        fetched[key] = 'ok'; hideSnack(); render();
      })
      .catch(function () { fetched[key] = 'err'; snack('Couldn’t load Akshat’s availability.', true); render(); })
      .then(function () { if (!Object.keys(fetched).some(function (k) { return fetched[k] === 'loading'; })) $('bar').classList.remove('on'); });
  }
  function known(d) { return Object.prototype.hasOwnProperty.call(cache, ymd(d)); }

  /* drawing */
  function render() {
    var days = visibleDays(), today = startOfDay(new Date()), now = Date.now(), first = days[0], last = days[days.length - 1];
    var mid = days[Math.floor(days.length / 2)];
    var t = first.getMonth() === last.getMonth() ? first.toLocaleString('en-US', { month: 'long', year: 'numeric' })
      : first.toLocaleString('en-US', { month: 'short' }) + ' – ' + last.toLocaleString('en-US', { month: 'short', year: 'numeric' });
    if (view === 1) t = first.toLocaleString('en-US', { month: innerWidth < 560 ? 'short' : 'long', day: 'numeric', year: 'numeric' });
    $('title').textContent = t;
    $('weekNo').textContent = 'Week ' + isoWeek(view === 7 ? addDays(first, 1) : mid);
    document.title = t + ' · Calendar · Akshat Bhaskar';
    $('viewName').textContent = view === 1 ? 'Day' : view === 4 ? '4 days' : 'Week';

    var all = [addDays(first, -1)].concat(days, [addDays(last, 1)]), N = all.length, trackW = 'width:' + (N / view * 100).toFixed(4) + '%';
    var head = '<div class="tz">' + gmtLabel() + '</div><div class="hwrap" id="hwrap"><div class="track" id="htrack" style="' + trackW + '">';
    all.forEach(function (d) {
      var cls = sameDay(d, today) ? ' today' : d < today ? ' past' : '';
      head += '<button class="dh' + cls + '" data-day="' + ymd(d) + '" aria-label="' + d.toDateString() + '">' + d.toLocaleString('en-US', { weekday: 'short' }) + ' <b>' + d.getDate() + '</b></button>';
    });
    $('days').innerHTML = head + '</div></div>';

    var html = '<div class="hours">';
    var showsToday = days.some(function (d) { return sameDay(d, today); });
    var nowTop = ((now - today.getTime()) / 36e5).toFixed(4);
    for (var h = 1; h < 24; h++) if (!showsToday || Math.abs(h - nowTop) > .3) html += '<span style="top:calc(var(--row) * ' + h + ')">' + String(h).padStart(2, '0') + ':00</span>';
    if (showsToday) html += '<span class="nowpill" style="top:calc(var(--row) * ' + nowTop + ')">' + hhmm(new Date()) + '</span>';
    html += '</div><div class="cwrap" id="cwrap"><div class="track" id="ctrack" style="' + trackW + '">';
    all.forEach(function (d) {
      html += '<div class="col" data-day="' + ymd(d) + '">';
      var freeSet = {}; (cache[ymd(d)] || []).forEach(function (ms) { freeSet[ms] = 1; });
      var have = known(d), runKind = null, runStart = 0;
      var flush = function (endMs) {
        if (!runKind) return;
        if (show[runKind === 'weekend' ? 'off' : runKind]) html += block(runKind, runStart, endMs, endMs <= now);
        runKind = null;
      };
      for (var i = 0; i < 48; i++) {
        var ms = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, i * 30).getTime();
        if (ms + CELL <= now || !have) { flush(ms); continue; }
        var k = kindAt(ms, freeSet);
        if (k === 'free') { flush(ms); if (booked[ms]) html += mine(ms); continue; }
        if (k !== runKind) { flush(ms); runKind = k; runStart = Math.max(ms, now - (now % CELL)); }
      }
      flush(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime());
      html += '</div>';
    });
    html += '</div></div>';
    if (showsToday) html += '<div class="nowline" style="top:calc(var(--row) * ' + nowTop + ')"></div>';
    $('grid').innerHTML = html;
    if (showsToday) {
      var tc = document.querySelector('.col[data-day="' + ymd(today) + '"]');
      if (tc) tc.insertAdjacentHTML('beforeend', '<div class="nowline today" style="left:-1px;top:calc(var(--row) * ' + nowTop + ')"></div>');
    }
    $('days').style.setProperty('--sb', ($('scroll').offsetWidth - $('scroll').clientWidth) + 'px');
    if (picked) placeDraft(picked);
    applyOff(false);
    renderMini();
    load();
  }

  /* sideways scrolling between days, from a trackpad swipe or a finger, like a native calendar */
  function colW() { var w = $('cwrap'); return w ? w.clientWidth / view : 100; }
  function applyOff(anim) {
    ['htrack', 'ctrack'].forEach(function (id) {
      var t = $(id); if (!t) return;
      t.style.transition = anim ? 'transform .24s cubic-bezier(.2,.7,.2,1)' : 'none';
      t.style.transform = 'translateX(' + (off - colW()) + 'px)';
    });
  }
  function shiftBy(dx) {
    var w = colW(), moved = false;
    off += dx;
    while (off <= -w) { anchor = addDays(anchor, 1); off += w; moved = true; }
    while (off >= w) { anchor = addDays(anchor, -1); off -= w; moved = true; }
    if (moved) { syncMini(); render(); } else applyOff(false);
  }
  function snap() {
    var w = colW();
    if (off < -w / 2) { anchor = addDays(anchor, 1); off += w; syncMini(); render(); }
    else if (off > w / 2) { anchor = addDays(anchor, -1); off -= w; syncMini(); render(); }
    off = 0; requestAnimationFrame(function () { applyOff(true); });
  }
  document.querySelector('main').addEventListener('wheel', function (e) {
    if (e.ctrlKey) return;
    var dx = e.deltaX, dy = e.deltaY;
    if (e.shiftKey && !dx) { dx = dy; dy = 0; }
    if (Math.abs(dx) <= Math.abs(dy) || !dx) return;
    e.preventDefault();
    if ($('card').classList.contains('on')) closeCard();
    if (e.deltaMode === 1) dx *= 16;
    shiftBy(-dx);
    clearTimeout(snapT); snapT = setTimeout(snap, 140);
  }, { passive: false });
  function pos(s, e) {
    var a = new Date(s), base = new Date(a.getFullYear(), a.getMonth(), a.getDate()).getTime();
    return 'top:calc(var(--row) * ' + ((s - base) / 36e5).toFixed(4) + ' + 1px);height:calc(var(--row) * ' + ((e - s) / 36e5).toFixed(4) + ' - 2px)';
  }
  function ev(cls, s, e, title, extra) {
    var short = (e - s) <= CELL;
    return '<div class="ev ' + cls + (short ? ' short' : '') + '"' + (extra || '') + ' style="' + pos(s, e) + '" title="' + title + ', ' + span(new Date(s), new Date(e)) + '"><span class="t">' + title + '</span><span class="s">' + (short ? hhmm(new Date(s)) : span(new Date(s), new Date(e))) + '</span></div>';
  }
  function block(kind, s, e, past) { return ev(kind + (past ? ' past' : ''), s, e, LABEL[kind]); }
  function mine(ms) { return ev('mine', ms, ms + CELL, 'Coffee Chat'); }

  function renderMini() {
    var m = miniMonth, first = new Date(m.getFullYear(), m.getMonth(), 1), start = addDays(first, -first.getDay()), today = startOfDay(new Date()), vis = visibleDays();
    $('miniTitle').textContent = m.toLocaleString('en-US', { month: 'short', year: 'numeric' });
    var html = '<tr><th></th>' + ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr>';
    for (var w = 0; w < 6; w++) {
      var rowStart = addDays(start, w * 7), cur = vis.some(function (v) { return v >= rowStart && v < addDays(rowStart, 7); });
      html += '<tr' + (cur ? ' class="cur"' : '') + '><td class="wk">' + isoWeek(addDays(rowStart, 1)) + '</td>';
      for (var i = 0; i < 7; i++) {
        var d = addDays(rowStart, i), cls = [];
        if (d.getMonth() !== m.getMonth()) cls.push('out');
        if (sameDay(d, today)) cls.push('today');
        html += '<td><button class="' + cls.join(' ') + '" data-day="' + ymd(d) + '" aria-label="' + d.toDateString() + '">' + d.getDate() + '</button></td>';
      }
      html += '</tr>';
    }
    $('miniGrid').innerHTML = html;
  }

  /* navigation */
  function go(n) { off = 0; anchor = addDays(anchor, n * view); syncMini(); closeCard(); render(); }
  function goDay(str) { var p = str.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]); off = 0; anchor = view === 7 ? sunday(d) : d; syncMini(); closeCard(); render(); }
  function syncMini() { var m = addDays(anchor, Math.floor(view / 2)); miniMonth = new Date(m.getFullYear(), m.getMonth(), 1); }
  function setView(v) { if (v === 7 && view !== 7) anchor = sunday(anchor); off = 0; view = v; $('viewMenu').classList.remove('on'); $('viewBtn').setAttribute('aria-expanded', 'false'); closeCard(); render(); }
  $('todayBtn').onclick = function () { off = 0; anchor = view === 7 ? sunday(startOfDay(new Date())) : startOfDay(new Date()); syncMini(); closeCard(); render(); scrollToNow(); };
  $('prevBtn').onclick = function () { go(-1); };
  $('nextBtn').onclick = function () { go(1); };
  $('miniPrev').onclick = function () { miniMonth = new Date(miniMonth.getFullYear(), miniMonth.getMonth() - 1, 1); renderMini(); };
  $('miniNext').onclick = function () { miniMonth = new Date(miniMonth.getFullYear(), miniMonth.getMonth() + 1, 1); renderMini(); };
  $('miniGrid').onclick = function (e) { var b = e.target.closest('button[data-day]'); if (b) { goDay(b.dataset.day); document.body.classList.remove('openside'); } };
  $('days').onclick = function (e) { var b = e.target.closest('button[data-day]'); if (b) { view = 1; goDay(b.dataset.day); } };
  function toggleSide() { if (innerWidth <= 900) document.body.classList.toggle('openside'); else { document.body.classList.toggle('noside'); setTimeout(render, 220); } }
  $('hideSide').onclick = toggleSide; $('showSide').onclick = toggleSide;
  $('viewBtn').onclick = function (e) { e.stopPropagation(); var on = $('viewMenu').classList.toggle('on'); $('viewBtn').setAttribute('aria-expanded', on); };
  $('viewMenu').onclick = function (e) { var b = e.target.closest('button[data-view]'); if (b) setView(+b.dataset.view); };
  document.addEventListener('click', function (e) { if (!e.target.closest('.view')) $('viewMenu').classList.remove('on'); });
  document.querySelectorAll('.cals input').forEach(function (c) { c.onchange = function () { show[c.dataset.kind] = c.checked; render(); }; });
  function bookNext() {
    var all = Object.keys(cache).reduce(function (a, k) { return a.concat(cache[k]); }, []).filter(function (ms) { return ms > Date.now() && !booked[ms]; }).sort(function (a, b) { return a - b; });
    document.body.classList.remove('openside');
    if (!all.length) { go(1); snack('Looking for the next free time…'); return; }
    var d = startOfDay(new Date(all[0]));
    if (!visibleDays().some(function (v) { return sameDay(v, d); })) { off = 0; anchor = view === 7 ? sunday(d) : d; syncMini(); render(); }
    placeDraft(all[0]); var el = $('draft');
    if (el) { el.scrollIntoView({ block: 'center' }); openCard(all[0]); }
  }
  $('newBtn').onclick = bookNext; $('schedBtn').onclick = bookNext;
  document.addEventListener('keydown', function (e) {
    if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === 'escape') closeCard();
    else if (k === 't') $('todayBtn').click();
    else if (k === 'n' || k === 'j' || e.key === 'ArrowRight') go(1);
    else if (k === 'p' || k === 'k' || e.key === 'ArrowLeft') go(-1);
    else if (k === 'd' || k === '1') setView(1);
    else if (k === 'x' || k === '4') setView(4);
    else if (k === 'w' || k === '7') setView(7);
    else if (k === 'c') bookNext();
  });
  var lastW = innerWidth;
  addEventListener('resize', function () {
    if ((lastW < 560) !== (innerWidth < 560) || (lastW < 900) !== (innerWidth < 900)) { view = innerWidth < 900 ? 4 : 7; if (view === 7) anchor = sunday(anchor); }
    lastW = innerWidth; render();
  });
  setInterval(render, 60000);

  /* click or drag on empty time to place a meeting */
  function isFree(ms) { var k = ymd(new Date(ms)); return !!(cache[k] && cache[k].indexOf(ms) >= 0) && !booked[ms] && ms > Date.now(); }
  function cellAt(col, y) {
    var r = col.getBoundingClientRect(), idx = Math.max(0, Math.min(47, Math.floor((y - r.top) / (r.height / 48)))), p = col.dataset.day.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2], 0, idx * 30).getTime();
  }
  function placeDraft(ms) {
    var old = $('draft'); if (old) old.remove();
    var col = document.querySelector('.col[data-day="' + ymd(new Date(ms)) + '"]');
    if (col) col.insertAdjacentHTML('beforeend', ev('draft', ms, ms + CELL, 'Coffee Chat with Akshat', ' id="draft"'));
  }
  function whyNot(ms) {
    if (ms <= Date.now()) return 'That time has already passed.';
    if (booked[ms]) return 'You’ve already booked that time.';
    var k = kindAt(ms, {});
    return k === 'sleep' ? 'Akshat is asleep then.' : k === 'busy' ? 'Akshat is busy then.' : 'Akshat isn’t taking meetings then.';
  }
  var drag = null;
  $('grid').addEventListener('pointerdown', function (e) {
    var col = e.target.closest('.col'); if (!col || e.button > 0) return;
    if (e.pointerType === 'touch') { clearTimeout(snapT); drag = { col: col, touch: true, x: e.clientX, y: e.clientY, lx: e.clientX }; return; }
    e.preventDefault();
    var ms = cellAt(col, e.clientY);
    drag = { col: col, ms: ms, ok: isFree(ms) };
    closeCard(true);
    if (drag.ok) { picked = ms; placeDraft(ms); }
  });
  addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (drag.touch) {
      var tx = e.clientX - drag.x, ty = e.clientY - drag.y;
      if (!drag.swipe && Math.abs(tx) > 10 && Math.abs(tx) > Math.abs(ty) * 1.2) drag.swipe = true;
      if (drag.swipe) { shiftBy(e.clientX - drag.lx); }
      drag.lx = e.clientX;
      return;
    }
    var col = document.elementsFromPoint(e.clientX, e.clientY).map(function (x) { return x.closest && x.closest('.col'); }).filter(Boolean)[0] || drag.col;
    var ms = cellAt(col, e.clientY);
    if (ms !== drag.ms && isFree(ms)) { drag.ms = ms; drag.ok = true; drag.col = col; picked = ms; placeDraft(ms); }
  });
  addEventListener('pointercancel', function () { if (drag && drag.swipe) snap(); drag = null; });
  addEventListener('pointerup', function (e) {
    if (!drag) return;
    var d = drag; drag = null;
    if (d.touch) {
      if (d.swipe) { snap(); return; }
      if (Math.abs(e.clientY - d.y) > 8 || Math.abs(e.clientX - d.x) > 8) return;
      d.ms = cellAt(d.col, e.clientY); d.ok = isFree(d.ms);
      if (d.ok) { picked = d.ms; placeDraft(d.ms); }
    }
    if (d.ok) openCard(d.ms); else { closeCard(); snack(whyNot(d.ms)); }
  });

  /* booking popover */
  function openCard(ms) {
    picked = ms; var el = $('draft'), card = $('card'), a = new Date(ms), b = new Date(ms + CELL);
    card.classList.remove('ok');
    $('cardWhen').textContent = a.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' + span(a, b);
    $('cardMsg').textContent = ''; $('cardMsg').className = 'msg'; $('saveBtn').disabled = false; $('saveBtn').textContent = 'Book';
    card.classList.add('on');
    if (el) {
      var r = el.getBoundingClientRect(), cw = card.offsetWidth, ch = card.offsetHeight;
      var left = r.right + 10 + cw < innerWidth ? r.right + 10 : r.left - cw - 10;
      card.style.left = Math.max(8, Math.min(left, innerWidth - cw - 8)) + 'px';
      card.style.top = Math.max(8, Math.min(r.top - 20, innerHeight - ch - 8)) + 'px';
    }
    setTimeout(function () { $('bookForm').elements.name.focus({ preventScroll: true }); }, 0);
  }
  function closeCard(keepDraft) { $('card').classList.remove('on'); if (!keepDraft) { picked = null; var d = $('draft'); if (d) d.remove(); } }
  $('cardClose').onclick = function () { closeCard(); };
  document.addEventListener('mousedown', function (e) { if ($('card').classList.contains('on') && !e.target.closest('#card, .col, #newBtn, #schedBtn')) closeCard(); });

  $('bookForm').onsubmit = function (e) {
    e.preventDefault();
    var f = e.target, name = f.elements.name.value.trim(), email = f.elements.email.value.trim(), notes = f.elements.notes.value.trim(), msg = $('cardMsg');
    if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.className = 'msg err'; msg.textContent = 'Add your name and a valid email.'; return; }
    var ms = picked; if (!ms) return;
    $('saveBtn').disabled = true; $('saveBtn').textContent = 'Booking…'; msg.className = 'msg'; msg.textContent = '';
    var body = { start: new Date(ms).toISOString(), eventTypeSlug: EVENT, username: USER, attendee: { name: name, email: email, timeZone: tz, language: 'en' } };
    if (notes) body.bookingFieldsResponses = { notes: notes };
    fetch(API + '/bookings', { method: 'POST', headers: { 'Content-Type': 'application/json', 'cal-api-version': '2024-08-13' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || j.status !== 'success') throw new Error((j.error && j.error.message) || r.status); return j; }); })
      .then(function () {
        booked[ms] = true;
        $('cardDone').textContent = 'You’re booked. A calendar invite with the Google Meet link is on its way to ' + email + '.';
        $('card').classList.add('ok');
        picked = null; render();
      })
      .catch(function () {
        msg.className = 'msg err';
        msg.innerHTML = 'That didn’t go through. <a href="https://cal.com/' + USER + '/' + EVENT + '?date=' + ymd(new Date(ms)) + '" target="_blank" rel="noopener">Book on cal.com</a> instead.';
        $('saveBtn').disabled = false; $('saveBtn').textContent = 'Book';
      });
  };

  function snack(text, retry) { $('snackText').textContent = text; $('snackBtn').hidden = !retry; $('snack').classList.add('on'); if (!retry) { clearTimeout(snack.t); snack.t = setTimeout(hideSnack, 3000); } }
  function hideSnack() { $('snack').classList.remove('on'); }
  $('snackBtn').onclick = function () { Object.keys(fetched).forEach(function (k) { if (fetched[k] === 'err') delete fetched[k]; }); hideSnack(); render(); };

  function scrollToNow() {
    var row = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row'));
    $('scroll').scrollTop = Math.max(0, (Math.max(7, Math.min(new Date().getHours() - 2, 17))) * row);
  }
  render();
  scrollToNow();
})();
</script>
</body>
</html>
