<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side Quests · Akshat Bhaskar</title>
<meta name="description" content="Side quests: moments from outside the day job.">
<link rel="canonical" href="https://akshatb.com/sidequests">
<link rel="icon" type="image/jpeg" href="images/akshat.jpg">
<link rel="apple-touch-icon" sizes="180x180" href="images/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff; --ink: #111; --muted: #888; --line: #ccc; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 18px/1.7 "Newsreader", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 14vh 20px 10vh; }
  h1 { font-size: 18px; font-weight: 400; margin: 0; }
  .site { margin: 0 0 48px; }
  p { margin: 0; }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-color: var(--ink); }
  .shots { display: flex; flex-direction: column; gap: 32px; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .shot { flex: var(--r) 1 0; min-width: 0; margin: 0; }
  .shot img { display: block; width: 100%; height: auto; border-radius: 4px; background: color-mix(in srgb, var(--ink) 6%, var(--bg)); }
  .shot.crop img { aspect-ratio: 1; object-fit: cover; object-position: var(--pos); }
  .shot figcaption { margin-top: 8px; font-size: 15px; line-height: 1.5; color: var(--muted); }
  @media (max-width: 520px) {
    .shots { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: row dense; gap: 24px 10px; align-items: start; }
    .row { display: contents; }
    .shot.wide { grid-column: span 2; }
  }
</style>
</head>
<body>
<main>
  <h1>Side Quests</h1>
  <p class="site"><a href="/">Akshat Bhaskar</a></p>

  <div class="shots">
    <div class="row">
      <figure class="shot" style="--r: 1.500">
        <img src="images/sidequests/1.webp" width="1600" height="1067" alt="Students holding certificates with the President of India at Rashtrapati Bhavan" loading="eager">
        <figcaption>getting awarded by the President of India</figcaption>
      </figure>
      <figure class="shot" style="--r: 1.754">
        <img src="images/sidequests/2.webp" width="1200" height="684" alt="Interviewing Prof. Sandeep Juneja in front of a whiteboard of equations" loading="eager">
        <figcaption>interviewing Prof. Sandeep Juneja for my podcast</figcaption>
      </figure>
    </div>
    <div class="row">
      <figure class="shot crop" style="--r: 1; --pos: 50% 22%">
        <img src="images/sidequests/8.webp" width="738" height="1246" alt="Speaking into a microphone wearing a President, Student Council sash" loading="lazy">
        <figcaption>speaking as President of the Student Council</figcaption>
      </figure>
      <figure class="shot wide" style="--r: 2.254">
        <img src="images/sidequests/3.webp" width="1280" height="568" alt="Presenting a proof of Euler’s Criterion on a whiteboard" loading="lazy">
        <figcaption>giving a presentation on Euler’s Criterion for determining whether an integer is a quadratic residue modulo a prime (11th grade)</figcaption>
      </figure>
    </div>
    <div class="row">
      <figure class="shot" style="--r: 1.333">
        <img src="images/sidequests/12.webp" width="1600" height="1200" alt="With the team holding certificates at Masters’ Union" loading="lazy">
        <figcaption>won the Masters’ Union National Startup Weekend in just 10th Grade</figcaption>
      </figure>
      <figure class="shot" style="--r: 0.750">
        <img src="images/sidequests/4.webp" width="1200" height="1600" alt="A plate of pasta, bread, bruschetta and chocolate mousse" loading="lazy">
        <figcaption>at the Swiss Embassy of India for free food</figcaption>
      </figure>
      <figure class="shot" style="--r: 1.333">
        <img src="images/sidequests/15.webp" width="1600" height="1200" alt="A lecture slide on the orbit of the star S2 around Sagittarius A*" loading="lazy">
        <figcaption>attending a very introductory lecture on Neutron Stars &amp; Pulsars</figcaption>
      </figure>
    </div>
    <div class="row">
      <figure class="shot" style="--r: 1.499">
        <img src="images/sidequests/6.webp" width="1024" height="683" alt="Playing guitar on stage with a drummer behind" loading="lazy">
        <figcaption>playing guitar at a school performance</figcaption>
      </figure>
      <figure class="shot" style="--r: 1.499">
        <img src="images/sidequests/7.webp" width="1024" height="683" alt="On stage as the Ghost of Christmas Past in A Christmas Carol" loading="lazy">
        <figcaption>portraying the Ghost of Christmas Past in Dickens’ <i>A Christmas Carol</i></figcaption>
      </figure>
    </div>
    <div class="row">
      <figure class="shot crop" style="--r: 1; --pos: 50% 35%">
        <img src="images/sidequests/11.webp" width="780" height="1040" alt="Holding a trophy and a medal after a football tournament" loading="lazy">
        <figcaption>under 11 football wins</figcaption>
      </figure>
      <figure class="shot" style="--r: 1.499">
        <img src="images/sidequests/13.webp" width="511" height="341" alt="Playing football in a DPS vs MIS match" loading="lazy">
        <figcaption>DPS X MIS</figcaption>
      </figure>
    </div>
    <div class="row">
      <figure class="shot" style="--r: 1.333">
        <img src="images/sidequests/16.webp" width="1170" height="878" alt="Prof. Haruzo Hida lecturing at a whiteboard" loading="lazy">
        <figcaption>attending a lecture by <a href="https://en.wikipedia.org/wiki/Haruzo_Hida">Haruzo Hida</a> on the Riemann Zeta Function ζ(s)</figcaption>
      </figure>
      <figure class="shot" style="--r: 1.333">
        <img src="images/sidequests/19.webp" width="1600" height="1200" alt="A selfie with Aman Gupta" loading="lazy">
        <figcaption>pitching to Aman Gupta?</figcaption>
      </figure>
    </div>
    <div class="row">
      <figure class="shot" style="--r: 1.333">
        <img src="images/sidequests/5.webp" width="1600" height="1200" alt="A pigeon taking off over the still water of Dal Lake" loading="lazy">
        <figcaption>photographing pigeons at the Dal Lake</figcaption>
      </figure>
      <figure class="shot" style="--r: 1.500">
        <img src="images/sidequests/14.webp" width="1600" height="1067" alt="Yaks grazing below a mountain in Arunachal Pradesh" loading="lazy">
        <figcaption>clicking pics around Arunachal Pradesh</figcaption>
      </figure>
    </div>
    <div class="row">
      <figure class="shot" style="--r: 0.741">
        <img src="images/sidequests/18.webp" width="705" height="951" alt="Riding a camel on sand dunes" loading="lazy">
        <figcaption>exploring my hometown of Rajasthan</figcaption>
      </figure>
      <figure class="shot" style="--r: 0.750">
        <img src="images/sidequests/9.webp" width="1200" height="1600" alt="Riding a white horse through a pine forest with patches of snow" loading="lazy">
        <figcaption>riding a horse through the snowy pines</figcaption>
      </figure>
      <figure class="shot" style="--r: 0.750">
        <img src="images/sidequests/20.webp" width="1500" height="2000" alt="Crouching beside a snowman in a hat, sunglasses and scarf" loading="lazy">
        <figcaption>shenanigans in the Himalayas</figcaption>
      </figure>
    </div>
  </div>
</main>
</body>
</html>
