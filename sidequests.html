<style>
  :root { --bg: #fff; --ink: #111; --muted: #888; --line: #ccc; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 18px/1.7 "Newsreader", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 14vh 20px 10vh; }
  h1 { font-size: 18px; font-weight: 400; margin: 0; }
  .site { margin: 0 0 48px; }
  p { margin: 0; }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-color: var(--ink); }
  .shots { display: flex; flex-direction: column; gap: 32px; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .shot { flex: var(--r) 1 0; min-width: 0; margin: 0; }
  .shot img { display: block; width: 100%; height: auto; border-radius: 4px; background: color-mix(in srgb, var(--ink) 6%, var(--bg)); }
  .shot.crop img { aspect-ratio: 1; object-fit: cover; object-position: var(--pos); }
  .shot figcaption { margin-top: 8px; font-size: 15px; line-height: 1.5; color: var(--muted); }
  .shot.side { flex: 1 1 auto; display: flex; gap: 16px; align-items: flex-end; }
  .shot.side .open { flex: 0 0 38%; }
  .shot.side figcaption { flex: 1; margin: 0; }
  .shot.side.flip { flex-direction: row-reverse; }
  .shot.side:not(.flip) .open { flex-basis: 48%; }
  .open { display: block; width: 100%; padding: 0; border: 0; background: none; border-radius: 4px; cursor: zoom-in; }
  .open img { transition: opacity .2s ease; }
  .open:hover img { opacity: .88; }
  .open:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .lb { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 48px 56px 28px; background: #111; }
  .lb.on { display: flex; }
  .lb img { max-width: 100%; max-height: calc(100vh - 150px); border-radius: 4px; object-fit: contain; }
  .lb p { max-width: 640px; color: #aaa; font-size: 15px; line-height: 1.5; text-align: center; }
  .lb button { position: absolute; background: none; border: 0; color: #bbb; font: inherit; cursor: pointer; padding: 12px 16px; }
  .lb button:hover { color: #fff; }
  .lb .prev, .lb .next { top: 50%; transform: translateY(-50%); font-size: 28px; }
  .lb .prev { left: 4px; } .lb .next { right: 4px; }
  .lb .close { top: 6px; right: 6px; font-size: 16px; }
  .lb .count { position: absolute; top: 18px; left: 22px; color: #777; font-size: 14px; }
  @media (max-width: 520px) {
    .shots { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: row dense; gap: 24px 10px; align-items: start; }
    .row { display: contents; }
    .shot.wide, .shot.side { grid-column: span 2; }
    .shot.side .open { flex-basis: 45%; }
    .lb { padding: 48px 12px 24px; }
    .lb .prev, .lb .next { top: auto; bottom: 8px; transform: none; }
  }
</style>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <span class="count" id="lb-count"></span>
  <button type="button" class="close" aria-label="Close">close</button>
  <button type="button" class="prev" aria-label="Previous photo">&larr;</button>
  <img id="lb-img" alt="">
  <p id="lb-cap"></p>
  <button type="button" class="next" aria-label="Next photo">&rarr;</button>
</div>
<script>
  (function () {
    var shots = [].slice.call(document.querySelectorAll('.shot'));
    var lb = document.getElementById('lb'), img = document.getElementById('lb-img'), cap = document.getElementById('lb-cap'), count = document.getElementById('lb-count');
    var at = 0, opener = null, x0 = null;
    function show(i) {
      at = (i + shots.length) % shots.length;
      var src = shots[at].querySelector('img'), fc = shots[at].querySelector('figcaption');
      img.src = src.src; img.alt = src.alt;
      cap.textContent = fc ? fc.textContent : '';
      count.textContent = (at + 1) + ' / ' + shots.length;
    }
    function open(i) {
      opener = document.activeElement; show(i);
      lb.hidden = false; lb.classList.add('on'); document.body.style.overflow = 'hidden';
      lb.querySelector('.close').focus();
    }
    function close() {
      lb.classList.remove('on'); lb.hidden = true; document.body.style.overflow = '';
      if (opener) opener.focus();
    }
    shots.forEach(function (f, i) { f.querySelector('.open').addEventListener('click', function () { open(i); }); });
    lb.querySelector('.prev').addEventListener('click', function () { show(at - 1); });
    lb.querySelector('.next').addEventListener('click', function () { show(at + 1); });
    lb.querySelector('.close').addEventListener('click', close);
    lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
    document.addEventListener('keydown', function (e) {
      if (lb.hidden) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(at - 1);
      else if (e.key === 'ArrowRight') show(at + 1);
    });
    lb.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) show(at + (dx < 0 ? 1 : -1));
    });
  })();
</script>
