<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side Quests · Akshat Bhaskar</title>
<meta name="description" content="Side quests: moments from outside the day job.">
<link rel="canonical" href="https://akshatb.com/sidequests">
<link rel="icon" type="image/jpeg" href="images/akshat.jpg">
<link rel="apple-touch-icon" sizes="180x180" href="images/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff; --ink: #111; --muted: #888; --line: #ccc; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 18px/1.7 "Newsreader", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 14vh 20px 10vh; }
  h1 { font-size: 18px; font-weight: 400; margin: 0; }
  .site { margin: 0 0 48px; }
  p { margin: 0; }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-color: var(--ink); }
  .shots { width: min(720px, calc(100vw - 40px)); position: relative; left: 50%; transform: translateX(-50%); }
  .shot { margin: 0 0 56px; }
  .shot:last-child { margin-bottom: 0; }
  .shot img { display: block; width: 100%; height: auto; border-radius: 6px; background: color-mix(in srgb, var(--ink) 6%, var(--bg)); }
  .shot.tall { max-width: 420px; }
  .shot figcaption { max-width: 560px; margin-top: 12px; color: var(--muted); }
  @media (max-width: 600px) { .shot { margin-bottom: 40px; } .shot.tall { max-width: none; } }
</style>
</head>
<body>
<main>
  <h1>Side Quests</h1>
  <p class="site"><a href="/">Akshat Bhaskar</a></p>

  <div class="shots">
    <figure class="shot">
      <img src="images/sidequests/1.webp" width="1600" height="1067" alt="Students holding certificates with the President of India at Rashtrapati Bhavan" loading="eager">
      <figcaption>getting awarded by the President of India</figcaption>
    </figure>
    <figure class="shot">
      <img src="images/sidequests/2.webp" width="1200" height="684" alt="Interviewing Prof. Sandeep Juneja in front of a whiteboard of equations" loading="eager">
      <figcaption>interviewing Prof. Sandeep Juneja for my podcast</figcaption>
    </figure>
    <figure class="shot">
      <img src="images/sidequests/3.webp" width="1280" height="568" alt="Presenting a proof of Euler’s Criterion on a whiteboard" loading="lazy">
      <figcaption>giving a presentation on Euler’s Criterion for determining whether an integer is a quadratic residue modulo a prime</figcaption>
    </figure>
    <figure class="shot tall">
      <img src="images/sidequests/4.webp" width="1200" height="1600" alt="A plate of pasta, bread, bruschetta and chocolate mousse" loading="lazy">
      <figcaption>at the Swiss Embassy of India for free food</figcaption>
    </figure>
    <figure class="shot">
      <img src="images/sidequests/5.webp" width="1600" height="1200" alt="A pigeon taking off over the still water of Dal Lake" loading="lazy">
      <figcaption>photographing pigeons at the Dal Lake</figcaption>
    </figure>
  </div>
</main>
</body>
</html>
