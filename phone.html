<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Akshat Bhaskar · phone</title>
<meta content="Akshat Bhaskar's website, as a phone. Every app is a real page." name="description"/>
<meta content="#f2f1ee" name="theme-color"/>
<link href="images/akshat.jpg" rel="icon" type="image/jpeg"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
  :root {
    --page: #f2f1ee;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root { --page: #0d0d0e; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page); font-family: var(--sans); color: #fff;
    display: grid; place-items: center; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ── the device ─────────────────────────────────────────── */
  .device {
    position: relative; height: min(844px, calc(100dvh - 48px)); aspect-ratio: 390 / 844;
    border-radius: 15.5% / 7.2%; padding: 1.15%;
    background: linear-gradient(145deg, #d9d7d2, #8c8a86 30%, #c9c7c2 55%, #6f6d69 80%, #bdbbb6);
    box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 40px 90px -30px rgba(0,0,0,.45), 0 12px 30px -12px rgba(0,0,0,.3);
  }
  .device::before, .device::after { /* side buttons */
    content: ""; position: absolute; width: 0.9%; border-radius: 2px; background: #9b9994;
  }
  .device::before { left: -0.7%; top: 20%; height: 8%; }
  .device::after { right: -0.7%; top: 26%; height: 11%; }
  .screen {
    --u: calc(100cqw / 390);
    position: relative; width: 100%; height: 100%; overflow: hidden; container-type: size;
    border-radius: 14% / 6.6%; background: #000;
  }
  .scr { --u: calc(100cqw / 390); position: absolute; inset: 0; }

  @media (max-width: 520px) {
    body { place-items: stretch; }
    .device { height: 100dvh; width: 100vw; aspect-ratio: auto; border-radius: 0; padding: 0; background: none; box-shadow: none; }
    .device::before, .device::after { display: none; }
    .screen { border-radius: 0; }
    .island { display: none; }
  }

  /* wallpaper */
  .wall { position: absolute; inset: 0; background: #2a2620 url('images/alexander-vertical.webp') center / cover no-repeat; }
  .wall::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.35)); }

  /* status bar + island */
  .status {
    position: absolute; z-index: 30; top: 0; left: 0; right: 0; height: calc(var(--u) * 54);
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(var(--u) * 4) calc(var(--u) * 34) 0 calc(var(--u) * 46);
    font-weight: 600; font-size: calc(var(--u) * 16.5); letter-spacing: -0.01em; color: #fff; pointer-events: none;
    transition: color .3s;
  }
  .device.in-app.light .status { color: #000; }
  .status .icons { display: flex; gap: calc(var(--u) * 6); align-items: center; }
  .status svg { height: calc(var(--u) * 12); width: auto; fill: currentColor; }
  .island {
    position: absolute; z-index: 31; top: calc(var(--u) * 11); left: 50%; transform: translateX(-50%);
    width: calc(var(--u) * 122); height: calc(var(--u) * 36); border-radius: 999px; background: #000;
  }

  /* ── home screen ────────────────────────────────────────── */
  .home { position: absolute; inset: 0; padding: calc(var(--u) * 62) calc(var(--u) * 22) 0; transition: transform .45s cubic-bezier(.2,.8,.2,1), filter .45s; }
  .device.in-app .home { transform: scale(.92); filter: blur(4px) brightness(.7); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: calc(var(--u) * 21); row-gap: calc(var(--u) * 20); }
  .widget {
    grid-column: span 2; aspect-ratio: 1; border-radius: calc(var(--u) * 22); position: relative; overflow: hidden;
    text-decoration: none; display: block;
  }
  .wlabel { display: block; text-align: center; font-size: calc(var(--u) * 11.5); margin-top: calc(var(--u) * 5); font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .wcell { grid-column: span 2; }

  .gh { background: #161b22; padding: calc(var(--u) * 13); }
  .gh .cells { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: calc(var(--u) * 3); height: 100%; }
  .gh .cells i { border-radius: calc(var(--u) * 2.5); background: #2d333b; }
  .gh .cells i[data-l="1"] { background: #0e4429; } .gh .cells i[data-l="2"] { background: #006d32; }
  .gh .cells i[data-l="3"] { background: #26a641; } .gh .cells i[data-l="4"] { background: #39d353; }

  .wx { background: linear-gradient(180deg, #4a6a8f, #6e8fb3); padding: calc(var(--u) * 13) calc(var(--u) * 14); color: #fff; }
  .wx .city { font-weight: 600; font-size: calc(var(--u) * 14); display: flex; align-items: center; gap: calc(var(--u) * 3); }
  .wx .city svg { width: calc(var(--u) * 9); fill: #fff; }
  .wx .temp { font-size: calc(var(--u) * 44); font-weight: 300; line-height: 1.05; letter-spacing: -0.02em; }
  .wx .cond { position: absolute; left: calc(var(--u) * 14); bottom: calc(var(--u) * 12); font-size: calc(var(--u) * 12.5); font-weight: 600; line-height: 1.25; }
  .wx .cond svg { display: block; width: calc(var(--u) * 16); height: calc(var(--u) * 16); margin-bottom: calc(var(--u) * 3); fill: #fff; }

  .app { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 5); text-decoration: none; min-width: 0; }
  .icon {
    width: 100%; aspect-ratio: 1; border-radius: 23%; overflow: hidden; position: relative;
    display: grid; place-items: center; box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0,0,0,.25);
    transition: transform .15s;
  }
  .app:active .icon { transform: scale(.92); }
  .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .icon svg { width: 56%; height: 56%; }
  .app .name { font-size: calc(var(--u) * 11.5); font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120%; }

  .ic-research { background: linear-gradient(160deg, #5ac8fa, #0a72d8); }
  .ic-writing { background: linear-gradient(160deg, #ff9f43, #e8501d); }
  .ic-books { background: linear-gradient(160deg, #ffb340, #ff7a00); }
  .ic-awards { background: linear-gradient(160deg, #ffe08a, #d79a17); }
  .ic-settings { background: linear-gradient(160deg, #a5a9b0, #6c7079); }
  .ic-builds { background: linear-gradient(160deg, #3fb8ff, #0b5ce0); }
  .ic-mail { background: linear-gradient(160deg, #5ec2ff, #1574f0); }
  .ic-files { background: #fff; }
  .ic-photos { background: #fff; }
  .ic-cal { background: #fff; color: #000; display: flex; flex-direction: column; justify-content: flex-start; padding-top: 9%; }
  .ic-cal b { color: #ff3b30; font-size: calc(var(--u) * 10); font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
  .ic-cal span { font-size: calc(var(--u) * 33); font-weight: 300; line-height: 1; letter-spacing: -0.03em; }

  .search {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--u) * 122);
    display: flex; align-items: center; gap: calc(var(--u) * 5); padding: calc(var(--u) * 6) calc(var(--u) * 12);
    border-radius: 999px; background: rgba(40,36,30,.42); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    font-size: calc(var(--u) * 12.5); font-weight: 600; text-decoration: none;
  }
  .search svg { width: calc(var(--u) * 11); fill: #fff; }
  .dock {
    position: absolute; left: calc(var(--u) * 12); right: calc(var(--u) * 12); bottom: calc(var(--u) * 12);
    padding: calc(var(--u) * 16) calc(var(--u) * 16); border-radius: calc(var(--u) * 36);
    background: rgba(60,52,42,.38); -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4);
    display: grid; grid-template-columns: repeat(4, 1fr); column-gap: calc(var(--u) * 26);
  }
  .dock .name { display: none; }

  /* ── app views ──────────────────────────────────────────── */
  .view {
    --bg: #000; --fg: #fff; --mut: rgba(235,235,245,.6); --card: #1c1c1e; --line: rgba(84,84,88,.6); --acc: #0a84ff;
    position: absolute; inset: 0; z-index: 20; background: var(--bg); color: var(--fg);
    overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
    padding: calc(var(--u) * 58) calc(var(--u) * 20) calc(var(--u) * 50);
    border-radius: inherit; visibility: hidden; opacity: 0; transform: scale(.2);
    transition: transform .42s cubic-bezier(.2,.85,.25,1), opacity .25s, visibility 0s .42s;
  }
  .view::-webkit-scrollbar { display: none; }
  .device.light .view { --bg: #f2f2f7; --fg: #000; --mut: rgba(60,60,67,.6); --card: #fff; --line: rgba(60,60,67,.22); --acc: #007aff; }
  .view.open { visibility: visible; opacity: 1; transform: none; transition: transform .45s cubic-bezier(.2,.85,.25,1), opacity .2s, visibility 0s; }
  .homebar {
    position: absolute; z-index: 40; left: 50%; bottom: calc(var(--u) * 8); transform: translateX(-50%);
    width: calc(var(--u) * 134); height: calc(var(--u) * 5); border-radius: 99px; background: #fff; opacity: .9;
  }
  .device.in-app.light .homebar { background: #000; }
  .homebar-hit { position: absolute; z-index: 41; left: 25%; right: 25%; bottom: 0; height: calc(var(--u) * 26); cursor: pointer; }

  .back {
    display: grid; place-items: center; width: calc(var(--u) * 34); height: calc(var(--u) * 34); border-radius: 50%;
    background: var(--card); margin: 0 0 calc(var(--u) * 12);
  }
  .back svg { width: calc(var(--u) * 12); stroke: var(--acc); fill: none; stroke-width: 2.4; }
  .v-title { font-size: calc(var(--u) * 32); font-weight: 700; letter-spacing: -0.02em; margin: 0 0 calc(var(--u) * 6); }
  .v-sub { color: var(--mut); font-size: calc(var(--u) * 14.5); margin: 0 0 calc(var(--u) * 20); line-height: 1.35; }
  .v-lead { font-size: calc(var(--u) * 18); font-weight: 600; line-height: 1.3; margin: calc(var(--u) * 14) 0 calc(var(--u) * 14); letter-spacing: -0.01em; }
  .view p.txt { color: var(--mut); font-size: calc(var(--u) * 14.5); line-height: 1.5; margin: 0 0 calc(var(--u) * 12); }
  .view p.txt a { color: var(--fg); }
  .sec { font-size: calc(var(--u) * 12.5); color: var(--mut); text-transform: uppercase; letter-spacing: .04em; margin: calc(var(--u) * 26) calc(var(--u) * 4) calc(var(--u) * 7); }
  .list { background: var(--card); border-radius: calc(var(--u) * 12); overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: calc(var(--u) * 12); padding: calc(var(--u) * 11) calc(var(--u) * 14);
    text-decoration: none; position: relative; min-height: calc(var(--u) * 46);
  }
  .row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: calc(var(--u) * 14); border-top: 0.5px solid var(--line); }
  .row.av + .row.av::before { left: calc(var(--u) * 58); }
  .row .main { flex: 1; min-width: 0; }
  .row .t { font-size: calc(var(--u) * 15.5); line-height: 1.25; }
  .row .s { font-size: calc(var(--u) * 13); color: var(--mut); margin-top: calc(var(--u) * 2); line-height: 1.35; }
  .row .chev { color: var(--mut); font-size: calc(var(--u) * 18); opacity: .7; }
  .row .val { color: var(--mut); font-size: calc(var(--u) * 14.5); }
  .avatar {
    flex: none; width: calc(var(--u) * 32); height: calc(var(--u) * 32); border-radius: calc(var(--u) * 8);
    display: grid; place-items: center; font-weight: 600; font-size: calc(var(--u) * 14); color: #fff; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* builds (app store) */
  .chips { display: flex; gap: calc(var(--u) * 8); margin: 0 0 calc(var(--u) * 16); overflow-x: auto; scrollbar-width: none; }
  .chip { flex: none; padding: calc(var(--u) * 6) calc(var(--u) * 13); border-radius: 99px; background: var(--card); font-size: calc(var(--u) * 13.5); font-weight: 500; }
  .chip.on { background: var(--fg); color: var(--bg); }
  .card { background: var(--card); border-radius: calc(var(--u) * 16); padding: calc(var(--u) * 14); display: flex; gap: calc(var(--u) * 13); align-items: center; margin: 0 0 calc(var(--u) * 10); }
  .card .bi { flex: none; width: calc(var(--u) * 58); height: calc(var(--u) * 58); border-radius: 23%; display: grid; place-items: center; font-weight: 700; font-size: calc(var(--u) * 20); color: #fff; overflow: hidden; }
  .card .bi img { width: 100%; height: 100%; object-fit: cover; }
  .card .main { flex: 1; min-width: 0; }
  .card .t { font-size: calc(var(--u) * 15.5); font-weight: 600; }
  .card .s { font-size: calc(var(--u) * 13); color: var(--mut); margin-top: calc(var(--u) * 2); line-height: 1.35; }
  .card .tag { font-size: calc(var(--u) * 11.5); color: var(--mut); margin-top: calc(var(--u) * 4); }
  .get { flex: none; padding: calc(var(--u) * 6) calc(var(--u) * 15); border-radius: 99px; background: rgba(120,120,128,.24); color: var(--acc); font-weight: 700; font-size: calc(var(--u) * 13.5); text-decoration: none; }
  .get.off { color: var(--mut); }

  /* photos */
  .pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * 2); margin: 0 calc(var(--u) * -20); }
  .pgrid button { aspect-ratio: 1; overflow: hidden; }
  .pgrid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lightbox {
    position: absolute; inset: 0; z-index: 25; background: #000; display: none; flex-direction: column; justify-content: center;
    padding: calc(var(--u) * 60) 0 calc(var(--u) * 50);
  }
  .lightbox.on { display: flex; }
  .lightbox img { width: 100%; max-height: 72%; object-fit: contain; }
  .lightbox p { color: #fff; text-align: center; font-size: calc(var(--u) * 14); padding: calc(var(--u) * 14) calc(var(--u) * 24) 0; margin: 0; }
  .lightbox .x { position: absolute; top: calc(var(--u) * 56); left: calc(var(--u) * 18); color: #0a84ff; font-size: calc(var(--u) * 16); }

  /* mail */
  .compose { background: var(--card); border-radius: calc(var(--u) * 12); overflow: hidden; }
  .compose label { display: flex; gap: calc(var(--u) * 8); padding: calc(var(--u) * 12) calc(var(--u) * 14); border-bottom: 0.5px solid var(--line); font-size: calc(var(--u) * 15); color: var(--mut); }
  .compose input, .compose textarea { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--fg); font: inherit; font-size: calc(var(--u) * 15); padding: 0; }
  .compose textarea { display: block; width: 100%; min-height: calc(var(--u) * 180); padding: calc(var(--u) * 12) calc(var(--u) * 14); resize: none; }
  .send { margin-top: calc(var(--u) * 14); width: 100%; padding: calc(var(--u) * 13); border-radius: calc(var(--u) * 12); background: var(--acc); color: #fff; font-weight: 600; font-size: calc(var(--u) * 15.5); }

  /* settings */
  .me { display: flex; align-items: center; gap: calc(var(--u) * 14); padding: calc(var(--u) * 12) calc(var(--u) * 14); }
  .me img { width: calc(var(--u) * 58); height: calc(var(--u) * 58); border-radius: 50%; object-fit: cover; }
  .me .t { font-size: calc(var(--u) * 19); font-weight: 600; }
  .toggle { width: calc(var(--u) * 51); height: calc(var(--u) * 31); border-radius: 99px; background: rgba(120,120,128,.32); position: relative; transition: background .2s; flex: none; }
  .toggle::after { content: ""; position: absolute; top: calc(var(--u) * 2); left: calc(var(--u) * 2); width: calc(var(--u) * 27); height: calc(var(--u) * 27); border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .2s; }
  .toggle.on { background: #34c759; }
  .toggle.on::after { transform: translateX(calc(var(--u) * 20)); }

  .embed { border-radius: calc(var(--u) * 12); overflow: hidden; margin: 0 0 calc(var(--u) * 6); background: var(--card); }
  .embed iframe { display: block; width: 100%; height: calc(var(--u) * 232); border: 0; }
  .btn { display: block; text-align: center; padding: calc(var(--u) * 13); border-radius: calc(var(--u) * 12); background: var(--acc); color: #fff; font-weight: 600; font-size: calc(var(--u) * 15.5); text-decoration: none; margin-top: calc(var(--u) * 14); }
  .foot { text-align: center; color: var(--mut); font-size: calc(var(--u) * 12); margin-top: calc(var(--u) * 26); }
</style>
</head>
<body>
<div class="device" id="device">
  <div class="screen" id="screen">
    <div class="wall"></div>
    <div class="island"></div>
    <div class="status">
      <span id="clock">9:41</span>
      <span class="icons">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4a6.6 6.6 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.6c-.4 0-.8.2-1.1.5L8 11.6l1.1-1.7c-.3-.3-.7-.5-1.1-.5Z"/></svg>
        <svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3.2" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="1.8"/><path d="M25 4v4c.8-.3 1.3-1.1 1.3-2S25.8 4.3 25 4Z" opacity=".45"/></svg>
      </span>
    </div>

    <div class="home scr" id="home">
      <div class="grid">
        <div class="wcell">
          <a class="widget gh" href="https://github.com/aksbhaskar" rel="noopener" target="_blank" aria-label="GitHub contributions"><div class="cells" id="ghcells"></div></a>
          <span class="wlabel">GitHub</span>
        </div>
        <div class="wcell">
          <div class="widget wx" aria-label="Weather in New Delhi">
            <div class="city">New Delhi <svg viewBox="0 0 10 10"><path d="M9.5.5 1 4.2l3.6 1.1L5.8 9z"/></svg></div>
            <div class="temp" id="wxtemp">--°</div>
            <div class="cond" id="wxcond"><span id="wxicon"></span><span id="wxtext">&nbsp;</span><br/><span id="wxhl"></span></div>
          </div>
          <span class="wlabel">Weather</span>
        </div>

        <button class="app" data-app="decoded"><span class="icon"><img alt="" src="images/phone/decoded.webp"/></span><span class="name">Decoded</span></button>
        <button class="app" data-app="about"><span class="icon"><img alt="" src="images/akshat.jpg"/></span><span class="name">About</span></button>
        <button class="app" data-app="research"><span class="icon ic-research"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.2L4.6 18.4A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.4-2.6L14 9.2V3"/><path d="M7.2 14h9.6"/></svg></span><span class="name">Research</span></button>
        <button class="app" data-app="writing"><span class="icon ic-writing"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5 19.5 9.5 9 20H4v-5z"/><path d="M12.5 6.5l5 5"/></svg></span><span class="name">Writing</span></button>

        <button class="app" data-app="books"><span class="icon ic-books"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5Z"/><path d="M12 6.5v13"/></svg></span><span class="name">Books</span></button>

  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-app]');
    if (a) { open(a.getAttribute('data-app'), a); return; }
    if (e.target.closest('[data-home]')) { close(); return; }
    var chip = e.target.closest('.chip');
    if (chip) {
      view.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c === chip); });
      var f = chip.getAttribute('data-f');
      view.querySelectorAll('.card').forEach(function (c) { c.style.display = (f === 'all' || c.getAttribute('data-c') === f) ? '' : 'none'; });
      return;
    }
    var ph = e.target.closest('[data-ph]');
    if (ph) {
      var p = PHOTOS[+ph.getAttribute('data-ph')];
      document.getElementById('lbimg').src = 'images/' + p[0];
      document.getElementById('lbcap').textContent = p[1];
      document.getElementById('lightbox').classList.add('on');
      return;
    }
    if (e.target.closest('#themeToggle')) {
      var on = device.classList.toggle('light');
      e.target.classList.toggle('on', on); e.target.setAttribute('aria-pressed', on);
      try { localStorage.setItem('phone-theme', on ? 'light' : 'dark'); } catch (_) {}
      return;
    }
    if (e.target.closest('#sendmail')) {
      var f = document.getElementById('compose');
      location.href = 'mailto:bhaskarakshat22@gmail.com?subject=' + encodeURIComponent(f.subject.value || 'Hello') + '&body=' + encodeURIComponent(f.body.value || '');
    }
  });
  document.getElementById('homebar').addEventListener('click', function () { close(); });
  document.getElementById('lbclose').addEventListener('click', function () { document.getElementById('lightbox').classList.remove('on'); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var lb = document.getElementById('lightbox');
    if (lb.classList.contains('on')) lb.classList.remove('on'); else close();
  });
  window.addEventListener('popstate', function () {
    var h = location.hash.slice(1);
    if (APPS[h]) open(h); else close(false);
  });
  try { if (localStorage.getItem('phone-theme') === 'light') device.classList.add('light'); } catch (_) {}
  if (APPS[location.hash.slice(1)]) open(location.hash.slice(1));

  /* clock + calendar icon */
  function tick() {
    var d = new Date();
    document.getElementById('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    document.getElementById('calday').textContent = d.toLocaleDateString('en-GB', { weekday: 'short' });
    document.getElementById('caldate').textContent = d.getDate();
  }
  tick(); setInterval(tick, 15000);

  /* GitHub widget: last 8 weeks of contributions */
  (function () {
    var box = document.getElementById('ghcells'), WEEKS = 8;
    function draw(days) {
      var html = '';
      for (var i = 0; i < WEEKS * 7; i++) html += '<i data-l="' + (days[i] ? days[i].level : 0) + '"></i>';
      box.innerHTML = html;
    }
    draw([]);
    fetch('https://github-contributions-api.jogruber.de/v4/aksbhaskar?y=last')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var c = (j && j.contributions) || [];
        // end on today, start on a Sunday so columns are whole weeks
        var end = c.length, start = Math.max(0, end - WEEKS * 7);
        while (start > 0 && new Date(c[start].date).getDay() !== 0) start--;
        draw(c.slice(start, start + WEEKS * 7));
      }).catch(function () {});
  })();

  /* weather widget: New Delhi, from Open-Meteo */
  (function () {
    var ICONS = {
      sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>',
      cloud: '<svg viewBox="0 0 24 24"><path d="M7 19a5 5 0 0 1-.6-10A6.5 6.5 0 0 1 19 10.5 4.3 4.3 0 0 1 18.5 19z"/></svg>',
      rain: '<svg viewBox="0 0 24 24"><path d="M7 15a5 5 0 0 1-.6-10A6.5 6.5 0 0 1 19 6.5 4.3 4.3 0 0 1 18.5 15z"/><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M8 18l-1 3M12.5 18l-1 3M17 18l-1 3"/></g></svg>',
      storm: '<svg viewBox="0 0 24 24"><path d="M7 14a5 5 0 0 1-.6-10A6.5 6.5 0 0 1 19 5.5 4.3 4.3 0 0 1 18.5 14z"/><path d="M12.5 13l-3 5h3l-1.5 4.5 4.5-6.5h-3l1.5-3z"/></svg>',
      fog: '<svg viewBox="0 0 24 24"><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 9h18M5 13h14M3 17h18"/></g></svg>'
    };
    function kind(c) {
      if (c === 0) return ['sun', 'Clear'];
      if (c <= 2) return ['cloud', 'Partly cloudy'];
      if (c === 3) return ['cloud', 'Cloudy'];
      if (c === 45 || c === 48) return ['fog', 'Haze'];
      if (c >= 51 && c <= 57) return ['rain', 'Drizzle'];
      if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return ['rain', 'Rain'];
      if (c >= 95) return ['storm', 'Thunderstorm'];
      return ['cloud', 'Cloudy'];
    }
    fetch('https://api.open-meteo.com/v1/forecast?latitude=28.61&longitude=77.21&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FKolkata&forecast_days=1')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var k = kind(j.current.weather_code);
        document.getElementById('wxtemp').textContent = Math.round(j.current.temperature_2m) + '°';
        document.getElementById('wxicon').innerHTML = ICONS[k[0]];
        document.getElementById('wxtext').textContent = k[1];
        document.getElementById('wxhl').textContent = 'H:' + Math.round(j.daily.temperature_2m_max[0]) + '° L:' + Math.round(j.daily.temperature_2m_min[0]) + '°';
      }).catch(function () { document.getElementById('wxtext').textContent = 'New Delhi'; });
  })();
})();
</script>
</body>
</html>
