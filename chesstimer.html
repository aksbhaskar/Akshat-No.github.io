<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♟️ Chess Timer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1e1e1e;
    --border-active: #3a3a3a;
    --text-primary: #e8e8e8;
    --text-secondary: #4a4a4a;
    --text-muted: #2a2a2a;
    --accent: #c8a96e;
    --accent-dim: #7a6240;
    --danger: #8b3a3a;
    --danger-bright: #c85a5a;
    --active-glow: rgba(200, 169, 110, 0.06);
    --active-border: rgba(200, 169, 110, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
    overflow: hidden;
    position: relative;
    user-select: none;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(30,25,18,0.4) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Subtle grid texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    position: relative;
    z-index: 1;
  }

  /* ─── PLAYER PANELS ─── */
  .player {
    width: 340px;
    height: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    position: relative;
    transition: background 0.2s ease, border-color 0.2s ease;
    overflow: hidden;
  }

  .player::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--active-glow);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .player.top {
    transform: rotate(180deg);
    border-bottom: none;
  }

  .player.bottom {
    border-top: none;
  }

  .player.active {
    border-color: var(--active-border);
    background: #131310;
  }

  .player.active::before {
    opacity: 1;
  }

  .player.low-time .time-display {
    color: var(--danger-bright) !important;
    animation: pulse-danger 1s ease infinite;
  }

  .player.flagged {
    background: #0f0808;
  }

  .player.flagged .time-display {
    color: var(--danger) !important;
  }

  @keyframes pulse-danger {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .player-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-secondary);
    transition: color 0.2s ease;
  }

  .player.active .player-label {
    color: var(--accent-dim);
  }

  .time-display {
    font-family: 'DM Mono', monospace;
    font-size: 64px;
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--text-muted);
    line-height: 1;
    transition: color 0.3s ease;
  }

  .player.active .time-display {
    color: var(--text-primary);
  }

  /* Active indicator, thin line */
  .active-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    transform: scaleX(0);
    transition: transform 0.4s ease;
    transform-origin: center;
  }

  .player.top .active-bar {
    bottom: auto;
    top: 0;
  }

  .player.active .active-bar {
    transform: scaleX(1);
  }

  /* ─── MIDDLE CONTROL BAR ─── */
  .control-bar {
    width: 340px;
    height: 54px;
    background: #0d0d0d;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: relative;
    z-index: 2;
  }

  .control-bar::before,
  .control-bar::after {
    content: '';
    position: absolute;
    left: 20px; right: 20px;
    height: 1px;
    background: var(--border);
  }
  .control-bar::before { top: 0; }
  .control-bar::after { bottom: 0; }

  .btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }

  .btn:hover {
    border-color: var(--border-active);
    color: var(--text-primary);
    background: rgba(255,255,255,0.03);
  }

  .btn:active {
    background: rgba(255,255,255,0.06);
  }

  .btn svg {
    width: 14px; height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s ease;
  }

  .status-dot.running {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: blink 1.2s ease infinite;
  }

  .status-dot.paused {
    background: var(--text-secondary);
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ─── TIME SELECTOR ─── */
  .time-selector {
    position: absolute;
    bottom: -110px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, bottom 0.2s ease;
  }

  .time-selector.visible {
    opacity: 1;
    pointer-events: all;
    bottom: -98px;
  }

  .time-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .time-btn:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .time-btn.selected {
    border-color: var(--accent-dim);
    color: var(--accent);
    background: rgba(200,169,110,0.04);
  }

  /* ─── OVERLAY (game over) ─── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 10;
    backdrop-filter: blur(4px);
  }

  .overlay.visible {
    opacity: 1;
    pointer-events: all;
  }

  .overlay-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .overlay-result {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 300;
    color: var(--text-primary);
    letter-spacing: 0.05em;
  }

  .overlay-result span {
    color: var(--accent);
  }

  .overlay-btn {
    margin-top: 10px;
    background: none;
    border: 1px solid var(--border-active);
    color: var(--text-secondary);
    padding: 10px 28px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .overlay-btn:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
  }
</style>
<!-- print styles + reduced motion -->
<style>
@media print {
  .topbar, .hamburger, .nav-overlay, .progress-rule, .footer-socials { display: none !important; }
  body { background: #fff !important; color: #000 !important; }
  a { color: #000 !important; text-decoration: underline; }
  img { max-width: 100% !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>

<div class="wrapper">

  <!-- Top player (black, rotated) -->
  <div class="player top" id="player-top" onclick="handlePlayerClick('top')">
    <div class="player-label">Black</div>
    <div class="time-display" id="time-top">10:00</div>
    <div class="active-bar"></div>
  </div>

  <!-- Control bar -->
  <div class="control-bar">
    <!-- Reset -->
    <button class="btn" id="btn-reset" onclick="resetGame()" title="Reset">
      <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-5"/></svg>
    </button>

    <!-- Status indicator -->
    <div class="status-dot" id="status-dot"></div>

    <!-- Settings -->
    <button class="btn" id="btn-settings" onclick="toggleSettings()" title="Time control">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>

    <!-- Time selector dropdown -->
    <div class="time-selector" id="time-selector">
      <button class="time-btn" onclick="setTime(60)">1m</button>
      <button class="time-btn" onclick="setTime(180)">3m</button>
      <button class="time-btn selected" onclick="setTime(600)">10m</button>
      <button class="time-btn" onclick="setTime(900)">15m</button>
      <button class="time-btn" onclick="setTime(1800)">30m</button>
    </div>
  </div>

  <!-- Bottom player (white) -->
  <div class="player bottom" id="player-bottom" onclick="handlePlayerClick('bottom')">
    <div class="player-label">White</div>
    <div class="time-display" id="time-bottom">10:00</div>
    <div class="active-bar"></div>
  </div>

</div>

<!-- Game over overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-title">Time Expired</div>
  <div class="overlay-result" id="overlay-result"><span></span></div>
  <button class="overlay-btn" onclick="resetGame()">New Game</button>
</div>

<script>
  const PRESETS = { 60: '1:00', 180: '3:00', 600: '10:00', 900: '15:00', 1800: '30:00' };
  let baseTime = 600;
  let times = { top: 600, bottom: 600 };
  let activePlayer = null; // 'top' | 'bottom' | null
  let running = false;
  let interval = null;
  let gameOver = false;
  let settingsOpen = false;

  const els = {
    top: document.getElementById('player-top'),
    bottom: document.getElementById('player-bottom'),
    timeTop: document.getElementById('time-top'),
    timeBottom: document.getElementById('time-bottom'),
    dot: document.getElementById('status-dot'),
    overlay: document.getElementById('overlay'),
    overlayResult: document.getElementById('overlay-result'),
    selector: document.getElementById('time-selector'),
  };

  function fmt(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  function render() {
    els.timeTop.textContent = fmt(times.top);
    els.timeBottom.textContent = fmt(times.bottom);

    ['top', 'bottom'].forEach(p => {
      const el = els[p];
      el.classList.toggle('active', running && activePlayer === p);
      el.classList.toggle('low-time', times[p] <= 10 && times[p] > 0 && activePlayer === p && running);
    });

    els.dot.className = 'status-dot' + (running ? ' running' : activePlayer !== null ? ' paused' : '');
  }

  function tick() {
    if (!activePlayer || !running) return;
    times[activePlayer]--;
    if (times[activePlayer] <= 0) {
      times[activePlayer] = 0;
      running = false;
      clearInterval(interval);
      gameOver = true;
      const winner = activePlayer === 'top' ? 'White' : 'Black';
      els[activePlayer].classList.add('flagged');
      els.overlayResult.innerHTML = `<span>${winner}</span> wins`;
      els.overlay.classList.add('visible');
    }
    render();
  }

  function handlePlayerClick(player) {
    if (gameOver) return;
    if (settingsOpen) { closeSettings(); return; }

    // First move: start the other player's clock
    if (activePlayer === null) {
      // Clicking a player starts their opponent's clock
      activePlayer = player === 'top' ? 'bottom' : 'top';
      running = true;
      clearInterval(interval);
      interval = setInterval(tick, 1000);
      render();
      return;
    }

    // Can only press your own side when it's your turn
    if (activePlayer !== player) return;

    // Switch turn
    activePlayer = player === 'top' ? 'bottom' : 'top';
    render();
  }

  function resetGame() {
    clearInterval(interval);
    running = false;
    gameOver = false;
    activePlayer = null;
    times = { top: baseTime, bottom: baseTime };
    els.top.classList.remove('flagged', 'active', 'low-time');
    els.bottom.classList.remove('flagged', 'active', 'low-time');
    els.overlay.classList.remove('visible');
    closeSettings();
    render();
  }

  function setTime(seconds) {
    baseTime = seconds;
    document.querySelectorAll('.time-btn').forEach(b => {
      b.classList.toggle('selected', parseInt(b.textContent) === seconds/60 ||
        b.onclick.toString().includes(`(${seconds})`));
    });
    resetGame();
    closeSettings();
  }

  function toggleSettings() {
    settingsOpen ? closeSettings() : openSettings();
  }

  function openSettings() {
    settingsOpen = true;
    els.selector.classList.add('visible');
  }

  function closeSettings() {
    settingsOpen = false;
    els.selector.classList.remove('visible');
  }

  // Keyboard support
  document.addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); handlePlayerClick(activePlayer || 'bottom'); }
    if (e.key === 'r' || e.key === 'R') resetGame();
  });

  render();
</script>
</body>
</html>
