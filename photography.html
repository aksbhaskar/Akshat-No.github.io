  <script>
  (function () {
    var realTitle = document.title, titleTemp = false, awaySpin = null, idleTimer = null;
    function setTitle(m) { document.title = m; titleTemp = true; }
    function restoreTitle() { if (titleTemp) { document.title = realTitle; titleTemp = false; } }
    var awayMsgs = ["come back :(", "hello? :(", "i'll wait...", "still here :)"];
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { clearTimeout(idleTimer); clearInterval(awaySpin); var i = 0; setTitle(awayMsgs[0]); awaySpin = setInterval(function () { i = (i + 1) % awayMsgs.length; document.title = awayMsgs[i]; }, 2400); }
      else { clearInterval(awaySpin); awaySpin = null; document.title = "yay, you came back :)"; titleTemp = true; setTimeout(restoreTitle, 1700); scheduleIdle(); }
    });
    function scheduleIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(function () { if (!document.hidden) setTitle("still there? :)"); }, 60000); }
    ["mousemove","scroll","keydown","click","touchstart"].forEach(function (ev) { window.addEventListener(ev, function () { if (titleTemp && !document.hidden && document.title === "still there? :)") restoreTitle(); scheduleIdle(); }, { passive: true }); });
    scheduleIdle();
  })();
  </script>
