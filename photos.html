  <title>Corpus Delicti</title>
  <!-- private experiment, kept out of search and off the nav -->
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root { --ink: #141414; --bg: #fff; --muted: #666; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', serif;
      font-size: 15px;
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 600px; margin: 0 auto; padding: 3.2rem 1.4rem 6rem; }
    a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
    a:visited { color: var(--ink); }
    a:hover { text-decoration-thickness: 2px; }
    nav { margin-bottom: 2.6rem; }
    nav a { margin-right: 1.4rem; }
    h1 { font-size: 1em; font-weight: normal; margin: 0 0 2rem; }
    figure { margin: 0 0 2.6rem; max-width: 440px; }
    figure img { width: 100%; height: auto; display: block; }
    figcaption { margin-top: 0.55rem; color: var(--muted); }

    @media (min-width: 1000px) { body { font-size: 16px; } }
    @media (max-width: 640px) { body { font-size: 16.5px; } .wrap { padding: 2.6rem 1.3rem 5rem; } }
  </style>
</head>
