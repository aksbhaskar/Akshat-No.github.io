<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Budget Tracker 2025</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
/* ── Reset & Root ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0f1117;
  --surface:   #171c27;
  --surface2:  #1e2436;
  --border:    #2a3148;
  --border2:   #374060;
  --text:      #e8ecf4;
  --muted:     #7a86a3;
  --accent:    #4f8ef7;
  --accent2:   #3d6fd4;
  --green:     #34c97e;
  --green-bg:  #0d2b1f;
  --red:       #f05d5d;
  --red-bg:    #2b0d0d;
  --amber:     #f59e0b;
  --amber-bg:  #2b1d05;
  --purple:    #a78bfa;
  --purple-bg: #1c1430;
  --gold:      #e8c84a;
  --radius:    10px;
  --shadow:    0 4px 24px rgba(0,0,0,.45);
  font-size: 14px;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

/* ── Scrollbar ───────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

/* ── Top bar ─────────────────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,17,23,.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  display: flex; align-items: center; justify-content: space-between;
  height: 60px;
}
.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 1.25rem;
  letter-spacing: -.02em;
  color: var(--gold);
  display: flex; align-items: center; gap: 10px;
}
.logo span { font-size: .8rem; color: var(--muted); font-family: 'DM Sans', sans-serif; font-weight: 300; }
.header-actions { display: flex; gap: 10px; align-items: center; }
.save-badge {
  font-size: .7rem; font-family: 'JetBrains Mono', monospace;
  color: var(--green); background: var(--green-bg);
  border: 1px solid color-mix(in srgb, var(--green) 30%, transparent);
  padding: 3px 10px; border-radius: 99px;
  transition: opacity .4s;
}
.save-badge.hidden { opacity: 0; }

/* ── Month tab bar ───────────────────────────────────────────────────── */
.tab-bar {
  display: flex; align-items: center; gap: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; padding: 0 20px;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0;
  background: none; border: none; cursor: pointer;
  padding: 14px 20px;
  font-family: 'DM Sans', sans-serif;
  font-size: .82rem; font-weight: 500;
  color: var(--muted);
  position: relative;
  transition: color .2s;
  white-space: nowrap;
}
.tab-btn::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px; background: var(--accent);
  transform: scaleX(0); transition: transform .2s;
}
.tab-btn.active { color: var(--text); }
.tab-btn.active::after { transform: scaleX(1); }
.tab-btn:hover { color: var(--text); }
.tab-btn .tab-net {
  display: block; font-size: .65rem; font-family: 'JetBrains Mono', monospace;
  margin-top: 2px; text-align: center;
}
.tab-btn .tab-net.positive { color: var(--green); }
.tab-btn .tab-net.negative { color: var(--red); }

/* Dashboard tab special */
.tab-btn.dash-tab { color: var(--gold); }
.tab-btn.dash-tab.active::after { background: var(--gold); }

/* ── Main layout ─────────────────────────────────────────────────────── */
main { max-width: 1400px; margin: 0 auto; padding: 28px 24px 60px; }

/* ── Dashboard ───────────────────────────────────────────────────────── */
.dashboard { display: none; }
.dashboard.active { display: block; }

.dash-title {
  font-family: 'DM Serif Display', serif;
  font-size: 1.8rem; color: var(--gold); margin-bottom: 24px;
  letter-spacing: -.02em;
}

.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
.kpi-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 22px;
}
.kpi-label { font-size: .72rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .08em; }
.kpi-value { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; margin-top: 6px; }
.kpi-card.income .kpi-value { color: var(--green); }
.kpi-card.expense .kpi-value { color: var(--red); }
.kpi-card.net .kpi-value { color: var(--accent); }
.kpi-card.rate .kpi-value { color: var(--purple); }

/* Monthly summary table */
.section-label {
  font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em;
  color: var(--muted); margin: 28px 0 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.dash-table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
.dash-table {
  width: 100%; border-collapse: collapse;
  font-size: .8rem;
}
.dash-table th {
  background: var(--surface2); color: var(--muted);
  font-weight: 600; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em;
  padding: 11px 16px; text-align: right;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.dash-table th:first-child { text-align: left; }
.dash-table td {
  padding: 10px 16px; text-align: right;
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: .8rem;
}
.dash-table td:first-child { text-align: left; font-family: 'DM Sans', sans-serif; color: var(--text); }
.dash-table tr:last-child td { border-bottom: none; }
.dash-table tr:hover td { background: rgba(255,255,255,.025); }
.dash-table .income-val { color: var(--green); }
.dash-table .expense-val { color: var(--red); }
.dash-table .net-positive { color: var(--green); }
.dash-table .net-negative { color: var(--red); }
.dash-table .rate-val { color: var(--purple); }
.dash-table .total-row td {
  background: var(--surface2); font-weight: 700;
  border-top: 2px solid var(--border2);
}

/* ── Month sheet ─────────────────────────────────────────────────────── */
.month-sheet { display: none; }
.month-sheet.active { display: block; }

.month-header {
  display: flex; align-items: baseline; gap: 16px; margin-bottom: 24px;
}
.month-title {
  font-family: 'DM Serif Display', serif;
  font-size: 2rem; color: var(--text); letter-spacing: -.03em;
}
.month-year { color: var(--muted); font-size: 1rem; }
.month-net-badge {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.1rem; font-weight: 600;
  padding: 6px 18px; border-radius: 99px;
}
.month-net-badge.positive { background: var(--green-bg); color: var(--green); border: 1px solid color-mix(in srgb, var(--green) 30%, transparent); }
.month-net-badge.negative { background: var(--red-bg); color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 30%, transparent); }

/* Two-column layout for income + expense */
.sheet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 1100px) { .sheet-grid { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.panel-title {
  font-weight: 600; font-size: .85rem;
  display: flex; align-items: center; gap: 8px;
}
.panel-title.income-title { color: var(--green); }
.panel-title.expense-title { color: var(--red); }
.panel-total {
  font-family: 'JetBrains Mono', monospace;
  font-size: .9rem; font-weight: 600;
}

/* Table inside panel */
.budget-table { width: 100%; border-collapse: collapse; }
.budget-table .sub-head td {
  background: var(--surface2);
  font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); padding: 8px 14px;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.budget-table .col-headers td {
  font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); padding: 7px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  text-align: right;
}
.budget-table .col-headers td:first-child { text-align: left; }

.budget-table tr.data-row td {
  padding: 8px 14px;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
  vertical-align: middle;
  font-size: .8rem;
}
.budget-table tr.data-row:last-child td { border-bottom: none; }
.budget-table tr.data-row:hover td { background: rgba(255,255,255,.02); }
.budget-table .row-label { color: var(--text); }
.budget-table .row-freq { color: var(--muted); font-size: .7rem; }

/* Section group headers */
.group-head td {
  padding: 6px 14px !important;
  font-size: .68rem !important;
  font-weight: 700 !important;
  text-transform: uppercase;
  letter-spacing: .1em;
}
.group-head.compulsory td { background: rgba(245,158,11,.1); color: var(--amber); }
.group-head.investment td { background: rgba(52,201,126,.1); color: var(--green); }
.group-head.want td       { background: rgba(240,93,93,.1);  color: var(--red); }
.group-head.periodic td   { background: rgba(167,139,250,.1); color: var(--purple); }
.group-head.misc td       { background: rgba(122,134,163,.1); color: var(--muted); }

/* Input fields */
.amt-input {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px;
  padding: 5px 8px; width: 100px; text-align: right;
  font-family: 'JetBrains Mono', monospace; font-size: .78rem;
  transition: border-color .15s, background .15s;
  outline: none;
}
.amt-input:focus { border-color: var(--accent); background: var(--surface2); }
.amt-input.budgeted { border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.amt-input.actual   { border-color: color-mix(in srgb, var(--amber) 35%, transparent); }
.amt-input.actual:focus { border-color: var(--amber); }
.notes-input {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); border-radius: 6px;
  padding: 5px 8px; width: 100%; font-size: .72rem;
  font-family: 'DM Sans', sans-serif;
  outline: none; transition: border-color .15s;
}
.notes-input:focus { border-color: var(--border2); color: var(--text); }

.variance {
  font-family: 'JetBrains Mono', monospace; font-size: .75rem; text-align: right;
  min-width: 72px; display: inline-block;
}
.variance.pos { color: var(--green); }
.variance.neg { color: var(--red); }
.variance.zero { color: var(--muted); }

/* Panel footer totals */
.panel-footer {
  padding: 12px 18px;
  border-top: 2px solid var(--border2);
  background: var(--surface2);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px;
}
.footer-stat { text-align: right; }
.footer-stat-label { font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.footer-stat-value { font-family: 'JetBrains Mono', monospace; font-size: .95rem; font-weight: 600; margin-top: 2px; }

/* Net summary card */
.net-summary {
  margin-top: 20px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 24px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
}
.net-stat-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.net-stat-val { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 700; margin-top: 6px; }

/* ── Buttons ─────────────────────────────────────────────────────────── */
.btn {
  cursor: pointer; border: none; border-radius: 8px;
  font-family: 'DM Sans', sans-serif; font-weight: 500;
  font-size: .8rem; padding: 8px 16px;
  transition: opacity .15s, transform .1s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: .88; }
.btn-ghost { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--border2); }
.btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 30%, transparent); }
.btn-danger:hover { opacity: .8; }

/* ── Utility ─────────────────────────────────────────────────────────── */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.text-right { text-align: right; }
.flex { display: flex; align-items: center; gap: 6px; }
.mono { font-family: 'JetBrains Mono', monospace; }

/* ── Responsive ──────────────────────────────────────────────────────── */
@media (max-width: 768px) {
  header { padding: 0 16px; }
  main { padding: 16px 12px 60px; }
  .kpi-row { grid-template-columns: 1fr 1fr; }
  .net-summary { grid-template-columns: 1fr 1fr; }
  .amt-input { width: 80px; }
}
@media (max-width: 480px) {
  .kpi-row { grid-template-columns: 1fr; }
  .net-summary { grid-template-columns: 1fr; }
}
</style>
<!-- print styles + reduced motion -->
<style>
@media print {
  .topbar, .hamburger, .nav-overlay, .progress-rule, .footer-socials { display: none !important; }
  body { background: #fff !important; color: #000 !important; }
  a { color: #000 !important; text-decoration: underline; }
  img { max-width: 100% !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    🏠 Family Budget
    <span>2025 · May–December</span>
  </div>
  <div class="header-actions">
    <span class="save-badge hidden" id="saveBadge">✓ Saved</span>
    <button class="btn btn-danger" onclick="confirmReset()">↺ Reset All</button>
  </div>
</header>

<div class="tab-bar" id="tabBar">
  <button class="tab-btn dash-tab active" onclick="switchTab('dashboard')">📊 Dashboard</button>
</div>

<main id="mainContent">
  <!-- Dashboard injected here -->
</main>

<script>
/* ══════════════════════════════════════════════════════════════════════
   DATA DEFINITIONS
══════════════════════════════════════════════════════════════════════ */
const MONTHS = ["May","June","July","August","September","October","November","December"];
const YEAR   = 2025;

const INCOME_ROWS = [
  { id: "self_salary",   label: "Self Salary (Net)",    freq: "Monthly",    taxable: true  },
  { id: "spouse_salary", label: "Spouse Salary (Net)",  freq: "Monthly",    taxable: true  },
  { id: "rental",        label: "Rental Income",         freq: "Monthly",    taxable: true  },
  { id: "bonus",         label: "Bonus / Incentive",     freq: "Periodical", taxable: true  },
  { id: "dividends",     label: "Dividends",             freq: "Quarterly",  taxable: false },
  { id: "business",      label: "Business Income",       freq: "Monthly",    taxable: true  },
  { id: "freelance",     label: "Freelance Income",      freq: "Irregular",  taxable: true  },
  { id: "allowances",    label: "HRA / Allowances",      freq: "Monthly",    taxable: false },
  { id: "lta",           label: "LTA / Travel Allow.",   freq: "Annual",     taxable: false },
  { id: "gifts",         label: "Gifts / Windfall",      freq: "Irregular",  taxable: false },
  { id: "other_inc",     label: "Other Income",          freq: "Irregular",  taxable: true  },
];

const EXPENSE_GROUPS = [
  {
    id: "compulsory", label: "Monthly Compulsory, Needs", cls: "compulsory",
    rows: [
      { id: "rent",       label: "Rent / Home Loan EMI",  freq: "Monthly"   },
      { id: "society",    label: "Society Maintenance",    freq: "Monthly"   },
      { id: "electricity",label: "Electricity Bill",       freq: "Monthly"   },
      { id: "lpg",        label: "LPG / Gas Bill",         freq: "Monthly"   },
      { id: "water",      label: "Water Bill",             freq: "Monthly"   },
      { id: "wifi",       label: "Wi-Fi / Internet",       freq: "Monthly"   },
      { id: "mobile",     label: "Mobile Recharge",        freq: "Monthly"   },
      { id: "groceries",  label: "Groceries & Kitchen",    freq: "Monthly"   },
      { id: "vegetables", label: "Vegetables & Fruits",    freq: "Monthly"   },
      { id: "milk",       label: "Milk & Dairy",           freq: "Monthly"   },
      { id: "maid",       label: "Household Help (Maid)",  freq: "Monthly"   },
      { id: "petrol",     label: "Petrol / Fuel",          freq: "Monthly"   },
      { id: "school_fees",label: "School Fees",            freq: "Monthly"   },
      { id: "tuition",    label: "Children Tuition",       freq: "Monthly"   },
      { id: "medical",    label: "Medical / Medicines",    freq: "Monthly"   },
      { id: "health_ins", label: "Health Insurance",       freq: "Annual"    },
      { id: "life_ins",   label: "Life Insurance / LIC",   freq: "Annual"    },
    ]
  },
  {
    id: "investment", label: "Savings & Investments", cls: "investment",
    rows: [
      { id: "sip",        label: "SIP / Mutual Fund",      freq: "Monthly"   },
      { id: "rd_fd",      label: "RD / FD Deposit",        freq: "Monthly"   },
      { id: "ppf_nps",    label: "PPF / NPS",              freq: "Monthly"   },
      { id: "loan_emi",   label: "Other Loan EMI",          freq: "Monthly"   },
    ]
  },
  {
    id: "wants", label: "Wants & Lifestyle", cls: "want",
    rows: [
      { id: "dining",     label: "Dining Out / Zomato",    freq: "Monthly"   },
      { id: "entertain",  label: "Entertainment / Movies", freq: "Monthly"   },
      { id: "ott",        label: "OTT Subscriptions",      freq: "Monthly"   },
      { id: "salon",      label: "Personal Care / Salon",  freq: "Monthly"   },
      { id: "clothing",   label: "Clothing & Apparel",     freq: "Quarterly" },
      { id: "travel",     label: "Travel / Vacation",      freq: "Half-Yr"   },
      { id: "festivals",  label: "Festivals / Pooja",      freq: "Annual"    },
      { id: "gifts_out",  label: "Gifts (Family/Friends)", freq: "Irregular" },
      { id: "charity",    label: "Charity / Donation",     freq: "Irregular" },
    ]
  },
  {
    id: "periodic", label: "Periodic / Maintenance", cls: "periodic",
    rows: [
      { id: "vehicle",    label: "Vehicle Maintenance",    freq: "Quarterly" },
    ]
  },
  {
    id: "misc", label: "Variable / Miscellaneous", cls: "misc",
    rows: [
      { id: "misc",       label: "Miscellaneous",          freq: "Monthly"   },
    ]
  },
];

/* ══════════════════════════════════════════════════════════════════════
   STATE, loaded from localStorage, saved on every change
══════════════════════════════════════════════════════════════════════ */
const STORAGE_KEY = "family_budget_2025_v2";
let state = loadState();

function defaultState() {
  const s = {};
  for (const mon of MONTHS) {
    s[mon] = { income: {}, expense: {}, notes: {} };
    for (const row of INCOME_ROWS) {
      s[mon].income[row.id] = { budgeted: 0, actual: 0 };
    }
    for (const grp of EXPENSE_GROUPS)
      for (const row of grp.rows)
        s[mon].expense[row.id] = { budgeted: 0, actual: 0 };
  }
  return s;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const saved = JSON.parse(raw);
    // Merge to ensure new rows aren't missing
    const def = defaultState();
    for (const mon of MONTHS) {
      if (!saved[mon]) { saved[mon] = def[mon]; continue; }
      for (const row of INCOME_ROWS)
        if (!saved[mon].income[row.id]) saved[mon].income[row.id] = { budgeted: 0, actual: 0 };
      for (const grp of EXPENSE_GROUPS)
        for (const row of grp.rows)
          if (!saved[mon].expense[row.id]) saved[mon].expense[row.id] = { budgeted: 0, actual: 0 };
      if (!saved[mon].notes) saved[mon].notes = {};
    }
    return saved;
  } catch { return defaultState(); }
}

let saveTimer = null;
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const badge = document.getElementById('saveBadge');
  badge.classList.remove('hidden');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => badge.classList.add('hidden'), 2200);
}

/* ══════════════════════════════════════════════════════════════════════
   FORMAT HELPERS
══════════════════════════════════════════════════════════════════════ */
const fmt = n => {
  if (!n && n !== 0) return ', ';
  const abs = Math.abs(n);
  const s = '₹' + abs.toLocaleString('en-IN', { maximumFractionDigits: 0 });
  return n < 0 ? '(' + s + ')' : s;
};
const pct = n => isNaN(n) || !isFinite(n) ? ', ' : (n * 100).toFixed(1) + '%';
const num = s => { const v = parseFloat(String(s).replace(/[^0-9.-]/g, '')); return isNaN(v) ? 0 : v; };

function varianceHtml(v) {
  const cls = v > 0 ? 'pos' : v < 0 ? 'neg' : 'zero';
  const pre = v > 0 ? '+' : '';
  return `<span class="variance ${cls}">${pre}${fmt(v)}</span>`;
}

/* ══════════════════════════════════════════════════════════════════════
   MONTH TOTALS
══════════════════════════════════════════════════════════════════════ */
function monthTotals(mon) {
  const d = state[mon];
  let incBudg = 0, incAct = 0, expBudg = 0, expAct = 0;
  for (const row of INCOME_ROWS) {
    incBudg += d.income[row.id].budgeted;
    incAct  += d.income[row.id].actual;
  }
  for (const grp of EXPENSE_GROUPS)
    for (const row of grp.rows) {
      expBudg += d.expense[row.id].budgeted;
      expAct  += d.expense[row.id].actual;
    }
  return { incBudg, incAct, expBudg, expAct,
    netBudg: incBudg - expBudg, netAct: incAct - expAct,
    rateBudg: incBudg ? (incBudg - expBudg) / incBudg : 0,
    rateAct:  incAct  ? (incAct  - expAct)  / incAct  : 0 };
}

/* ══════════════════════════════════════════════════════════════════════
   TAB MANAGEMENT
══════════════════════════════════════════════════════════════════════ */
let currentTab = 'dashboard';

function buildTabs() {
  const bar = document.getElementById('tabBar');
  // Remove month tabs (keep first dashboard tab)
  while (bar.children.length > 1) bar.removeChild(bar.lastChild);
  for (const mon of MONTHS) {
    const t = monthTotals(mon);
    const netCls = t.netAct >= 0 ? 'positive' : 'negative';
    const netStr = t.incAct === 0 && t.expAct === 0 ? '' : fmt(t.netAct);
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.tab = mon;
    btn.innerHTML = `${mon}<span class="tab-net ${netCls}">${netStr}</span>`;
    btn.onclick = () => switchTab(mon);
    bar.appendChild(btn);
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', (b.dataset.tab || 'dashboard') === tab);
  });
  document.querySelectorAll('.tab-btn.dash-tab').forEach(b => {
    b.classList.toggle('active', tab === 'dashboard');
  });
  renderContent();
}

/* ══════════════════════════════════════════════════════════════════════
   RENDER ROUTER
══════════════════════════════════════════════════════════════════════ */
function renderContent() {
  const main = document.getElementById('mainContent');
  if (currentTab === 'dashboard') {
    main.innerHTML = buildDashboard();
  } else {
    main.innerHTML = buildMonthSheet(currentTab);
    attachInputListeners(currentTab);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   DASHBOARD
══════════════════════════════════════════════════════════════════════ */
function buildDashboard() {
  // Annual KPIs
  let totalIncAct = 0, totalExpAct = 0;
  for (const mon of MONTHS) {
    const t = monthTotals(mon);
    totalIncAct += t.incAct; totalExpAct += t.expAct;
  }
  const totalNet  = totalIncAct - totalExpAct;
  const totalRate = totalIncAct ? totalNet / totalIncAct : 0;

  const kpiNetCls = totalNet >= 0 ? 'var(--green)' : 'var(--red)';

  let kpiHtml = `
  <div class="kpi-row">
    <div class="kpi-card income">
      <div class="kpi-label">Total Income (Actual)</div>
      <div class="kpi-value">${fmt(totalIncAct)}</div>
    </div>
    <div class="kpi-card expense">
      <div class="kpi-label">Total Expenses (Actual)</div>
      <div class="kpi-value">${fmt(totalExpAct)}</div>
    </div>
    <div class="kpi-card net">
      <div class="kpi-label">Net Savings</div>
      <div class="kpi-value" style="color:${kpiNetCls}">${fmt(totalNet)}</div>
    </div>
    <div class="kpi-card rate">
      <div class="kpi-label">Avg Savings Rate</div>
      <div class="kpi-value">${pct(totalRate)}</div>
    </div>
  </div>`;

  // Monthly summary table
  let rows = '';
  for (const mon of MONTHS) {
    const t = monthTotals(mon);
    const nc = t.netAct >= 0 ? 'net-positive' : 'net-negative';
    rows += `<tr>
      <td>${mon} ${YEAR}</td>
      <td class="income-val">${fmt(t.incAct)}</td>
      <td class="expense-val">${fmt(t.expAct)}</td>
      <td class="${nc}">${fmt(t.netAct)}</td>
      <td class="rate-val">${pct(t.rateAct)}</td>
      <td class="income-val" style="opacity:.6">${fmt(t.incBudg)}</td>
      <td class="expense-val" style="opacity:.6">${fmt(t.expBudg)}</td>
      <td class="${t.netBudg>=0?'net-positive':'net-negative'}" style="opacity:.6">${fmt(t.netBudg)}</td>
    </tr>`;
  }

  // Total row
  let tIncBudg=0,tExpBudg=0,tNetBudg=0;
  for(const mon of MONTHS){const t=monthTotals(mon);tIncBudg+=t.incBudg;tExpBudg+=t.expBudg;tNetBudg+=t.netBudg;}
  rows += `<tr class="total-row">
    <td>TOTAL (May–Dec)</td>
    <td class="income-val">${fmt(totalIncAct)}</td>
    <td class="expense-val">${fmt(totalExpAct)}</td>
    <td class="${totalNet>=0?'net-positive':'net-negative'}">${fmt(totalNet)}</td>
    <td class="rate-val">${pct(totalRate)}</td>
    <td class="income-val" style="opacity:.6">${fmt(tIncBudg)}</td>
    <td class="expense-val" style="opacity:.6">${fmt(tExpBudg)}</td>
    <td class="${tNetBudg>=0?'net-positive':'net-negative'}" style="opacity:.6">${fmt(tNetBudg)}</td>
  </tr>`;

  return `
  <div class="dashboard active">
    <div class="dash-title">📊 Overview, May to December 2025</div>
    ${kpiHtml}
    <div class="section-label">Monthly Breakdown</div>
    <div class="dash-table-wrap">
      <table class="dash-table">
        <thead>
          <tr>
            <th>Month</th>
            <th>Income ↑</th>
            <th>Expense ↓</th>
            <th>Net Savings</th>
            <th>Rate %</th>
            <th>Budg. Income</th>
            <th>Budg. Expense</th>
            <th>Budg. Net</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p style="margin-top:12px;font-size:.72rem;color:var(--muted);">Click any month tab above to enter or edit figures. All data auto-saves in your browser.</p>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   MONTH SHEET
══════════════════════════════════════════════════════════════════════ */
function buildMonthSheet(mon) {
  const t = monthTotals(mon);
  const netBadgeCls = t.netAct >= 0 ? 'positive' : 'negative';

  const incomePanel = buildIncomePanel(mon);
  const expensePanel = buildExpensePanel(mon);

  const netActCls = t.netAct >= 0 ? 'var(--green)' : 'var(--red)';

  return `
  <div class="month-sheet active">
    <div class="month-header">
      <div>
        <div class="month-title">${mon} <span class="month-year">${YEAR}</span></div>
      </div>
      <div class="month-net-badge ${netBadgeCls}">Net: ${fmt(t.netAct)}</div>
    </div>

    <div class="sheet-grid">
      ${incomePanel}
      ${expensePanel}
    </div>

    <div class="net-summary">
      <div>
        <div class="net-stat-label">Total Income (Actual)</div>
        <div class="net-stat-val" style="color:var(--green)" id="sum_inc_act_${mon}">${fmt(t.incAct)}</div>
      </div>
      <div>
        <div class="net-stat-label">Total Expenses (Actual)</div>
        <div class="net-stat-val" style="color:var(--red)" id="sum_exp_act_${mon}">${fmt(t.expAct)}</div>
      </div>
      <div>
        <div class="net-stat-label">Net Savings (Actual)</div>
        <div class="net-stat-val" style="color:${netActCls}" id="sum_net_act_${mon}">${fmt(t.netAct)}</div>
      </div>
      <div>
        <div class="net-stat-label">Savings Rate</div>
        <div class="net-stat-val" style="color:var(--purple)" id="sum_rate_${mon}">${pct(t.rateAct)}</div>
      </div>
    </div>
  </div>`;
}

function buildIncomePanel(mon) {
  const d = state[mon].income;
  let totalBudg = 0, totalAct = 0;
  for (const r of INCOME_ROWS) { totalBudg += d[r.id].budgeted; totalAct += d[r.id].actual; }
  const varCls = (totalAct - totalBudg) >= 0 ? 'pos' : 'neg';
  const varPre = (totalAct - totalBudg) >= 0 ? '+' : '';

  let rows = `
    <tr class="col-headers">
      <td>Source</td>
      <td>Freq</td>
      <td style="text-align:right">Budgeted</td>
      <td style="text-align:right">Actual</td>
      <td style="text-align:right">Variance</td>
    </tr>`;

  for (const row of INCOME_ROWS) {
    const v = d[row.id];
    const variance = v.actual - v.budgeted;
    rows += `<tr class="data-row">
      <td class="row-label">${row.label}</td>
      <td class="row-freq">${row.freq}</td>
      <td><input class="amt-input budgeted" type="number" min="0" step="100"
          data-mon="${mon}" data-type="income" data-id="${row.id}" data-field="budgeted"
          value="${v.budgeted}" /></td>
      <td><input class="amt-input actual" type="number" min="0" step="100"
          data-mon="${mon}" data-type="income" data-id="${row.id}" data-field="actual"
          value="${v.actual}" /></td>
      <td>${varianceHtml(variance)}</td>
    </tr>`;
  }

  return `<div class="panel">
    <div class="panel-header">
      <div class="panel-title income-title">💰 Income</div>
      <div class="panel-total" style="color:var(--green)" id="inc_panel_total_${mon}">${fmt(totalAct)}</div>
    </div>
    <div style="overflow-x:auto">
      <table class="budget-table">${rows}</table>
    </div>
    <div class="panel-footer">
      <div>
        <div class="footer-stat-label" style="color:var(--muted)">Legend</div>
        <div style="font-size:.68rem;color:var(--muted);margin-top:4px">
          <span style="color:var(--accent)">■</span> Budgeted &nbsp;
          <span style="color:var(--amber)">■</span> Actual
        </div>
      </div>
      <div class="flex">
        <div class="footer-stat">
          <div class="footer-stat-label">Budgeted</div>
          <div class="footer-stat-value" style="color:var(--accent)" id="inc_budg_${mon}">${fmt(totalBudg)}</div>
        </div>
        <div class="footer-stat">
          <div class="footer-stat-label">Actual</div>
          <div class="footer-stat-value" style="color:var(--green)" id="inc_act_${mon}">${fmt(totalAct)}</div>
        </div>
        <div class="footer-stat">
          <div class="footer-stat-label">Variance</div>
          <div class="footer-stat-value">
            <span class="variance ${varCls}">${varPre}${fmt(totalAct - totalBudg)}</span>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function buildExpensePanel(mon) {
  const d = state[mon].expense;
  let totalBudg = 0, totalAct = 0;
  for (const grp of EXPENSE_GROUPS)
    for (const row of grp.rows) {
      totalBudg += d[row.id].budgeted;
      totalAct  += d[row.id].actual;
    }
  const varCls = (totalBudg - totalAct) >= 0 ? 'pos' : 'neg';
  const varPre = (totalBudg - totalAct) >= 0 ? '+' : '';

  let rows = `
    <tr class="col-headers">
      <td>Item</td>
      <td>Freq</td>
      <td style="text-align:right">Budgeted</td>
      <td style="text-align:right">Actual</td>
      <td style="text-align:right">Variance</td>
    </tr>`;

  for (const grp of EXPENSE_GROUPS) {
    rows += `<tr class="group-head ${grp.cls}"><td colspan="5">${grp.label}</td></tr>`;
    for (const row of grp.rows) {
      const v = d[row.id];
      const variance = v.budgeted - v.actual; // positive = under budget = good for expenses
      rows += `<tr class="data-row">
        <td class="row-label">${row.label}</td>
        <td class="row-freq">${row.freq}</td>
        <td><input class="amt-input budgeted" type="number" min="0" step="100"
            data-mon="${mon}" data-type="expense" data-id="${row.id}" data-field="budgeted"
            value="${v.budgeted}" /></td>
        <td><input class="amt-input actual" type="number" min="0" step="100"
            data-mon="${mon}" data-type="expense" data-id="${row.id}" data-field="actual"
            value="${v.actual}" /></td>
        <td>${varianceHtml(variance)}</td>
      </tr>`;
    }
  }

  return `<div class="panel">
    <div class="panel-header">
      <div class="panel-title expense-title">🧾 Expenses</div>
      <div class="panel-total" style="color:var(--red)" id="exp_panel_total_${mon}">${fmt(totalAct)}</div>
    </div>
    <div style="overflow-x:auto">
      <table class="budget-table">${rows}</table>
    </div>
    <div class="panel-footer">
      <div>
        <div class="footer-stat-label" style="color:var(--muted)">Variance = Budget − Actual</div>
        <div style="font-size:.68rem;color:var(--green);margin-top:4px">Green = under budget ✓</div>
      </div>
      <div class="flex">
        <div class="footer-stat">
          <div class="footer-stat-label">Budgeted</div>
          <div class="footer-stat-value" style="color:var(--accent)" id="exp_budg_${mon}">${fmt(totalBudg)}</div>
        </div>
        <div class="footer-stat">
          <div class="footer-stat-label">Actual</div>
          <div class="footer-stat-value" style="color:var(--red)" id="exp_act_${mon}">${fmt(totalAct)}</div>
        </div>
        <div class="footer-stat">
          <div class="footer-stat-label">Variance</div>
          <div class="footer-stat-value">
            <span class="variance ${varCls}">${varPre}${fmt(totalBudg - totalAct)}</span>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   INPUT LISTENERS + LIVE UPDATE
══════════════════════════════════════════════════════════════════════ */
function attachInputListeners(mon) {
  document.querySelectorAll('.amt-input').forEach(inp => {
    inp.addEventListener('change', handleInput);
    inp.addEventListener('input', handleInput);
  });
}

function handleInput(e) {
  const inp = e.target;
  const mon   = inp.dataset.mon;
  const type  = inp.dataset.type;   // income | expense
  const id    = inp.dataset.id;
  const field = inp.dataset.field;  // budgeted | actual
  const val   = Math.max(0, num(inp.value));

  state[mon][type][id][field] = val;
  saveState();
  liveUpdateMonth(mon);
}

function liveUpdateMonth(mon) {
  const t = monthTotals(mon);

  // Update variance cells (re-render all variance spans)
  document.querySelectorAll(`.amt-input[data-mon="${mon}"]`).forEach(inp => {
    const row = inp.closest('tr');
    if (!row) return;
    const lastTd = row.querySelector('td:last-child');
    if (!lastTd || !lastTd.querySelector('.variance')) return;

    const type  = inp.dataset.type;
    const id    = inp.dataset.id;
    const v = state[mon][type][id];
    const variance = type === 'income'
      ? v.actual - v.budgeted
      : v.budgeted - v.actual;
    lastTd.innerHTML = varianceHtml(variance);
  });

  // Panel totals
  const incAct  = sumInc(mon, 'actual');
  const incBudg = sumInc(mon, 'budgeted');
  const expAct  = sumExp(mon, 'actual');
  const expBudg = sumExp(mon, 'budgeted');

  setText(`inc_panel_total_${mon}`, fmt(incAct));
  setText(`inc_budg_${mon}`, fmt(incBudg));
  setText(`inc_act_${mon}`, fmt(incAct));
  setText(`exp_panel_total_${mon}`, fmt(expAct));
  setText(`exp_budg_${mon}`, fmt(expBudg));
  setText(`exp_act_${mon}`, fmt(expAct));

  // Net summary
  const netAct  = incAct - expAct;
  const netCls  = netAct >= 0 ? 'var(--green)' : 'var(--red)';
  setText(`sum_inc_act_${mon}`, fmt(incAct));
  setText(`sum_exp_act_${mon}`, fmt(expAct));
  const netEl = document.getElementById(`sum_net_act_${mon}`);
  if (netEl) { netEl.textContent = fmt(netAct); netEl.style.color = netCls; }
  setText(`sum_rate_${mon}`, pct(incAct ? netAct / incAct : 0));

  // Tab badge
  const tabBtn = document.querySelector(`.tab-btn[data-tab="${mon}"] .tab-net`);
  if (tabBtn) {
    const str = incAct === 0 && expAct === 0 ? '' : fmt(netAct);
    tabBtn.textContent = str;
    tabBtn.className = `tab-net ${netAct >= 0 ? 'positive' : 'negative'}`;
  }

  // Month header badge
  const badge = document.querySelector('.month-net-badge');
  if (badge) {
    badge.textContent = `Net: ${fmt(netAct)}`;
    badge.className = `month-net-badge ${netAct >= 0 ? 'positive' : 'negative'}`;
  }

  // Panel footer variance rows
  updateFooterVariance(`inc`, mon, incAct - incBudg, true);
  updateFooterVariance(`exp`, mon, expBudg - expAct, false);
}

function updateFooterVariance(prefix, mon, v, isInc) {
  // Footer variance is shown inline; simpler to just update the stat values
}

function sumInc(mon, field) {
  let s = 0;
  for (const r of INCOME_ROWS) s += state[mon].income[r.id][field];
  return s;
}
function sumExp(mon, field) {
  let s = 0;
  for (const grp of EXPENSE_GROUPS)
    for (const r of grp.rows) s += state[mon].expense[r.id][field];
  return s;
}
function setText(id, text) {
  const el = document.getElementById(id);
  if (el) el.textContent = text;
}

/* ══════════════════════════════════════════════════════════════════════
   RESET
══════════════════════════════════════════════════════════════════════ */
function confirmReset() {
  if (confirm('Reset ALL data for all months? This cannot be undone.')) {
    state = defaultState();
    saveState();
    buildTabs();
    renderContent();
  }
}

/* ══════════════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════════════ */
buildTabs();
renderContent();
</script>
</body>
</html>
