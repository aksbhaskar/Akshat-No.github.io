<style>
  /* the booking flow: a quiet month calendar in the page's own ink */
  .booker { margin: 0.4rem 0 0; color: #0a0a0a; }
  .booker p { margin: 0 !important; }
  .booker button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .booker button:disabled { cursor: default; }
  .bk-head { font-size: 1.05rem !important; opacity: 0.6; margin: 0 0 1.4rem !important; }
  .bk-cal { max-width: 19rem; transition: opacity .2s; }
  .bk-cal.loading .bk-grid { opacity: 0.35; }
  .bk-month { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 0.9rem; }
  .bk-title { font-size: 1.2rem; }
  .bk-nav { font-size: 1.2rem !important; width: 2rem; height: 2rem; line-height: 2rem; border-radius: 50% !important; transition: opacity .15s; }
  .bk-nav:hover:not(:disabled) { background: rgba(10,10,10,0.06) !important; }
  .bk-nav:disabled { opacity: 0.18; }
  .bk-week, .bk-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .bk-week span { font-size: 0.85rem; opacity: 0.4; padding-bottom: 0.4rem; }
  .bk-grid { row-gap: 0.15rem; transition: opacity .2s; }
  .bk-d { position: relative; justify-self: center; width: 2.35rem; height: 2.35rem; border-radius: 50% !important;
    font-size: 1.05rem !important; line-height: 1; opacity: 0.22; transition: background .15s, color .15s; }
  .bk-d.open { opacity: 1; }
  .bk-d.open::after { content: ""; position: absolute; left: 50%; bottom: 0.32rem; width: 3px; height: 3px; margin-left: -1.5px;
    border-radius: 50%; background: currentColor; }
  .bk-d.open:hover { background: rgba(10,10,10,0.07) !important; }
  .bk-d.on, .bk-d.on:hover { background: #0a0a0a !important; color: #f8f8f8 !important; }
  .bk-status { font-size: 1rem !important; opacity: 0.55; margin: 0.8rem 0 0 !important; min-height: 1.2em; }
  .bk-slots { margin: 1.6rem 0 0; }
  .bk-day-label { font-size: 1.1rem !important; margin: 0 0 0.7rem !important; }
  .bk-times { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.2rem, 1fr)); gap: 0.15rem 0.3rem; max-width: 24rem; }
  .bk-t { padding: 0.35rem 0 !important; font-size: 1.05rem !important; border-radius: 2px !important; text-align: center;
    border-bottom: 1px solid transparent !important; transition: background .15s, border-color .15s; }
  .bk-t:hover { border-bottom-color: #0a0a0a !important; }
  .bk-t.on, .bk-t.on:hover { background: #0a0a0a !important; color: #f8f8f8 !important; border-color: #0a0a0a !important; }
  .bk-form { margin-top: 1.8rem !important; max-width: 24rem; }
  .bk-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.8rem; margin-top: 0.4rem; }
  .booker .bk-go { background: #0a0a0a !important; color: #f8f8f8 !important; padding: 0.45rem 1.1rem !important; border-radius: 2px !important; font-size: 1rem !important; }

  .bk-err { color: #8e1f1a !important; font-size: 0.95rem !important; }
  .bk-booked { font-size: 1.2rem !important; }
  .bk-sub { opacity: 0.7; margin-top: 0.4rem !important; font-size: 1.05rem !important; }

<script>
  /* contact form -> Formspree */
  (function () {
    var form = document.getElementById('contact-form');
    var btn = document.getElementById('submit-btn');
    var status = document.getElementById('form-status');
    if (!form) return;
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      btn.disabled = true; btn.textContent = 'sending…';
      status.textContent = ''; status.className = 'status';
      try {
        var res = await fetch('https://formspree.io/f/xpqokanp', {
          method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' }
        });
        if (res.ok) { status.textContent = 'sent, thank you.'; status.classList.add('ok'); form.reset(); }
        else { var j = await res.json(); status.textContent = (j && j.errors ? j.errors.map(function (x) { return x.message; }).join(', ') : 'something went wrong.'); status.classList.add('err'); }
      } catch (err) { status.textContent = 'network error.'; status.classList.add('err'); }
      finally { btn.disabled = false; btn.textContent = 'send'; }
    });
  })();

  /* The tab title reacts when you leave, come back, or go idle. Nothing else. */
  (function () {
    var realTitle = document.title, titleTemp = false, awaySpin = null, idleTimer = null;
    function setTitle(m) { document.title = m; titleTemp = true; }
    function restoreTitle() { if (titleTemp) { document.title = realTitle; titleTemp = false; } }
    var awayMsgs = ['come back :(', 'hello? :(', "i'll wait...", 'still here :)'];
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        clearTimeout(idleTimer); clearInterval(awaySpin);
        var i = 0; setTitle(awayMsgs[0]);
        awaySpin = setInterval(function () { i = (i + 1) % awayMsgs.length; document.title = awayMsgs[i]; }, 2400);
      } else {
        clearInterval(awaySpin); awaySpin = null;
        document.title = 'yay, you came back :)'; titleTemp = true;
        setTimeout(restoreTitle, 1700); scheduleIdle();
      }
    });
    function scheduleIdle() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () { if (!document.hidden) setTitle('still there? :)'); }, 60000);
    }
    ['mousemove', 'scroll', 'keydown', 'click', 'touchstart'].forEach(function (ev) {
      window.addEventListener(ev, function () {
        if (titleTemp && !document.hidden && document.title === 'still there? :)') restoreTitle();
        scheduleIdle();
      }, { passive: true });
    });
    scheduleIdle();
  })();
  </script>
