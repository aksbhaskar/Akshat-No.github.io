<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0b0b; --card: #161616; --card-hi: #1d1d1d; --ink: #f2f2f2; --muted: #8a8a8a; --line: #2a2a2a; --accent: #8f9cff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 "Newsreader", Georgia, serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: underline; text-decoration-color: #555; text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--ink); }

  /* the board: an endless wall of photos you drag around */
  .board { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .board.drag { cursor: grabbing; }
  .layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .card { position: absolute; width: 220px; padding: 0; border: 1px solid transparent; border-radius: 14px; background: var(--card);
    overflow: hidden; text-align: left; color: inherit; font: inherit; cursor: inherit; transition: border-color .2s ease, background .2s ease; }
  .card:hover { background: var(--card-hi); }
  .card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card .ph { display: block; width: 100%; height: 270px; background: #1f1f1f; overflow: hidden; }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
  .card img.ok { opacity: 1; }
  .card .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 3.1em;
    margin: 10px 12px 12px; font-size: 13.5px; line-height: 1.55; color: #d6d6d6; }
  .card .t a { pointer-events: none; text-decoration: none; }

  /* top-left label, like a little chip */
  .top { position: fixed; left: 16px; top: 16px; z-index: 3; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; pointer-events: none; }
  .chip { pointer-events: auto; display: inline-flex; align-items: baseline; gap: 8px; padding: 7px 14px; border-radius: 999px;
    background: rgba(22,22,22,.82); border: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 15px; }
  .chip b { font-weight: 500; }
  .chip span { color: var(--muted); font-size: 13px; }
  .chip a { text-decoration: none; color: var(--muted); }
  .chip a:hover { color: var(--ink); }

  /* zoom controls, bottom right */
  .zoom { position: fixed; right: 16px; bottom: 16px; z-index: 3; display: flex; flex-direction: column; gap: 6px; transition: right .3s ease; }
  .zoom button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: rgba(22,22,22,.85); color: var(--ink);
    font: 400 18px/1 system-ui, sans-serif; cursor: pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .zoom button:hover { background: #262626; }
  .zoom button:focus-visible, .pane button:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* the side panel that slides in when you open a photo */
  .pane { position: fixed; top: 12px; right: 12px; bottom: 12px; z-index: 4; width: min(420px, calc(100vw - 24px)); display: flex; flex-direction: column;
    background: #121212; border: 1px solid var(--line); border-radius: 16px; transform: translateX(calc(100% + 24px)); transition: transform .32s cubic-bezier(.2,.7,.2,1);
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.8); }
  .pane.on { transform: none; }
  .pane .hd { display: flex; align-items: center; gap: 4px; padding: 14px 12px 10px 18px; }
  .pane .hd div { flex: 1; font-size: 13px; color: var(--muted); line-height: 1.35; }
  .pane .hd b { display: block; font-weight: 400; color: var(--ink); }
  .pane .hd button { width: 34px; height: 34px; border: 0; border-radius: 8px; background: none; color: #bbb; font: 400 20px/1 system-ui, sans-serif; cursor: pointer; }
  .pane .hd button:hover { background: #222; color: #fff; }
  .pane .bd { flex: 1; overflow: auto; padding: 0 18px 22px; }
  .pane .big { display: block; width: 100%; max-height: 62vh; object-fit: contain; border-radius: 10px; background: #0d0d0d; }
  .pane h2 { margin: 16px 0 0; font-size: 20px; font-weight: 500; line-height: 1.35; }
  .pane .more { margin: 18px 0 0; font-size: 13px; color: var(--muted); }
  .board.side .card.on { box-shadow: 0 0 0 1px var(--accent), 0 0 30px -6px rgba(143,156,255,.5); }
  .pane.on ~ .zoom { right: calc(min(420px, 100vw - 24px) + 28px); }

  @media (max-width: 640px) {
    .top { left: 10px; top: 10px; right: 10px; gap: 6px; flex-wrap: nowrap; }
    .chip { padding: 6px 11px; font-size: 13.5px; white-space: nowrap; }
    .chip span { font-size: 12px; }
    .pane { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 78vh; transform: translateY(calc(100% + 16px)); }
    .pane.on ~ .zoom { right: 16px; opacity: 0; pointer-events: none; }
    .pane .big { max-height: 46vh; }
  }
  @media (prefers-reduced-motion: reduce) { .pane, .card img { transition: none; } }
</style>
</head>
<body>
<div class="board" id="board" aria-label="Photographs. Drag to look around."><div class="layer" id="layer"></div></div>
<div class="top">
  <span class="chip"><b>Photography</b><span id="count"></span></span>
  <span class="chip"><a href="/">Akshat Bhaskar</a></span>
  <span class="chip"><a href="photography.html">list view</a></span>
</div>
<aside class="pane" id="pane" aria-label="Photo" aria-hidden="true">
  <div class="hd">
    <div><b>Photography</b><span id="pos"></span></div>
    <button type="button" id="prev" aria-label="Previous photo">&lsaquo;</button>
    <button type="button" id="next" aria-label="Next photo">&rsaquo;</button>
    <button type="button" id="close" aria-label="Close">&times;</button>
  </div>
  <div class="bd">
    <img class="big" id="big" alt="">
    <h2 id="cap"></h2>
    <p class="more">drag the board to keep exploring, or use &larr; &rarr;</p>
  </div>
</aside>
<div class="zoom">
  <button type="button" id="zin" aria-label="Zoom in">+</button>
  <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
  <button type="button" id="zreset" aria-label="Reset view">&#8634;</button>
</div>
<script>
(function () {
  var P = [{"src": "images/the_mighty_himalayas.webp", "cap": "The Mighty Himalayas"}, {"src": "images/kabootar_pigeon_taking_flight_at_the_dal_lake.webp", "cap": "Kabootar (Pigeon) taking flight at the Dal Lake"}, {"src": "images/yaks_in_arunachal_pradesh.webp", "cap": "Yaks in Arunachal Pradesh"}, {"src": "images/bay_of_bengal.webp", "cap": "Bay of Bengal"}, {"src": "images/hermit_crab.webp", "cap": "hermit crab: rent free since day one"}, {"src": "images/the_wonderous_clouds_of_andaman_d.webp", "cap": "the wonderous clouds of Andaman ;D"}, {"src": "images/dal_lake.webp", "cap": "Dal Lake"}, {"src": "images/diwali_rangoli.webp", "cap": "Diwali Rangoli!"}, {"src": "images/dal_lake_after_dark.webp", "cap": "Dal Lake after dark"}, {"src": "images/kathmandu.webp", "cap": "Kathmandu"}, {"src": "images/indian_ocean.webp", "cap": "Indian Ocean"}, {"src": "images/rajasthan_highway.jpg", "cap": "Rajasthan Highway"}, {"src": "images/camel_in_my_hometown_in_rajasthan.webp", "cap": "Camel in my hometown in Rajasthan"}, {"src": "images/arunachal_tree_shrine.webp", "cap": "a little tree shrine tucked away in the forests of Arunachal Pradesh"}, {"src": "images/life_at_13700_ft.webp", "cap": "life at 13,700 ft"}, {"src": "images/omkareshwar.webp", "cap": "life at Shri Omkareshwar Jyotirlinga Temple (one of the twelve most sacred, self-manifested shrines of Lord Shiva in Hinduism)"}, {"src": "images/fluffy_tawang_monastery.webp", "cap": "Fluffy from the Tawang Monastery"}, {"src": "images/port_blair.webp", "cap": "Port Blair"}, {"src": "images/havelock_island.webp", "cap": "Havelock Island"}, {"src": "images/shaheed_dweep_neil_island.webp", "cap": "Shaheed Dweep (Neil Island)"}, {"src": "images/natural_coral_bridge_howrah_bridge_at_neil_island.webp", "cap": "Natural Coral Bridge (Howrah Bridge) at Neil Island"}, {"src": "images/landscape_out_of_a_painting.webp", "cap": "the landscape looks out of a painting, really"}, {"src": "images/nariyal_bagicha.webp", "cap": "Nariyal Bagicha (Coconut Orchard)"}, {"src": "images/vinayak_savarkar_s_cell_at_the_infamous_kaala_paani_jail.webp", "cap": "Vinayak Savarkar's cell at the infamous Kaala Paani Jail"}, {"src": "images/art_gallery_in_andaman_and_nicobar.webp", "cap": "Art Gallery in Andaman and Nicobar"}, {"src": "images/tawang_monastery.webp", "cap": "Tawang Monastery (second largest Buddhist Monastery in the world, largest in India)"}, {"src": "images/trees_in_the_clouds.webp", "cap": "trees in the clouds (10,800 ft)"}, {"src": "images/narmada_river.webp", "cap": "Narmada River (one of the holiest and most venerated rivers in Hinduism, often revered as a living mother goddess known as Maa Narmada or Narmada Maiya)"}];
  var N = P.length;
  var W = 220, IH = 270, H = IH + 66, G = 18, CW = W + G, RH = H + G;
  var board = document.getElementById('board'), layer = document.getElementById('layer');
  var pane = document.getElementById('pane'), big = document.getElementById('big'), cap = document.getElementById('cap'), pos = document.getElementById('pos');
  document.getElementById('count').textContent = N + ' photos';
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var z = 1, x = 0, y = 0, vx = 0, vy = 0, live = {}, sel = -1, selKey = null;
  var ZMIN = 0.35, ZMAX = 2.2;

  /* every cell of the endless grid maps to a photo; neighbours never repeat */
  function idx(c, r) { return (((c * 11 + r * 5) % N) + N) % N; }
  function off(c) { return ((((c * 37) % 100) + 100) % 100) / 100 * RH; }

  function home() {
    var vw = innerWidth, vh = innerHeight;
    z = vw < 640 ? 0.72 : 1;
    x = vw / 2 - (W / 2) * z; y = vh / 2 - (off(0) + H / 2) * z;
  }

  function card(c, r) {
    var i = idx(c, r), p = P[i], el = document.createElement('button');
    el.type = 'button'; el.className = 'card'; el.dataset.i = i; el.dataset.k = c + ',' + r; el.tabIndex = -1;
    el.style.left = (c * CW) + 'px'; el.style.top = (r * RH + off(c)) + 'px';
    var ph = document.createElement('span'); ph.className = 'ph';
    var im = new Image(); im.alt = ''; im.draggable = false; im.decoding = 'async';
    im.onload = function () { im.classList.add('ok'); }; im.src = p.src;
    ph.appendChild(im);
    var t = document.createElement('span'); t.className = 't'; t.innerHTML = p.cap;
    el.appendChild(ph); el.appendChild(t);
    if (el.dataset.k === selKey) el.classList.add('on');
    return el;
  }

  function render() {
    layer.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) scale(' + z + ')';
    var vw = innerWidth, vh = innerHeight;
    var wx0 = -x / z, wx1 = (vw - x) / z, wy0 = -y / z, wy1 = (vh - y) / z;
    var c0 = Math.floor(wx0 / CW) - 1, c1 = Math.ceil(wx1 / CW) + 1, want = {};
    for (var c = c0; c <= c1; c++) {
      var o = off(c), r0 = Math.floor((wy0 - o) / RH) - 1, r1 = Math.ceil((wy1 - o) / RH) + 1;
      for (var r = r0; r <= r1; r++) {
        var k = c + ',' + r; want[k] = 1;
        if (!live[k]) { live[k] = card(c, r); layer.appendChild(live[k]); }
      }
    }
    for (var k2 in live) if (!want[k2]) { layer.removeChild(live[k2]); delete live[k2]; }
  }

  var raf = 0;
  function tick() {
    raf = 0;
    if (!down && (Math.abs(vx) > 0.05 || Math.abs(vy) > 0.05)) {
      x += vx; y += vy; vx *= 0.93; vy *= 0.93; schedule();
    }
    render();
  }
  function schedule() { if (!raf) raf = requestAnimationFrame(tick); }

  function zoomAt(nz, cx, cy) {
    nz = Math.max(ZMIN, Math.min(ZMAX, nz));
    x = cx - (cx - x) * nz / z; y = cy - (cy - y) * nz / z; z = nz; schedule();
  }
  function animateTo(tx, ty, tz) {
    if (still) { x = tx; y = ty; z = tz; schedule(); return; }
    var sx = x, sy = y, sz = z, t0 = performance.now();
    vx = vy = 0;
    (function step(t) {
      var k = Math.min(1, (t - t0) / 420), e = 1 - Math.pow(1 - k, 3);
      x = sx + (tx - sx) * e; y = sy + (ty - sy) * e; z = sz + (tz - sz) * e; render();
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  /* dragging, with a little glide when you let go; two fingers pinch to zoom */
  var pts = {}, down = false, moved = 0, lx = 0, ly = 0, lt = 0, pinch = 0;
  board.addEventListener('pointerdown', function (e) {
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    board.setPointerCapture(e.pointerId);
    down = true; moved = 0; vx = vy = 0; lx = e.clientX; ly = e.clientY; lt = performance.now();
    board.classList.add('drag');
    var ids = Object.keys(pts);
    if (ids.length === 2) { var a = pts[ids[0]], b = pts[ids[1]]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  board.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pts);
    if (ids.length === 2) {
      var a = pts[ids[0]], b = pts[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch) zoomAt(z * d / pinch, (a.x + b.x) / 2, (a.y + b.y) / 2);
      pinch = d; moved += 10; return;
    }
    var dx = e.clientX - lx, dy = e.clientY - ly, t = performance.now(), dt = Math.max(1, t - lt);
    x += dx; y += dy; moved += Math.abs(dx) + Math.abs(dy);
    vx = dx / dt * 16; vy = dy / dt * 16;
    lx = e.clientX; ly = e.clientY; lt = t; schedule();
  });
  function up(e) {
    var wasTap = moved < 6 && Object.keys(pts).length === 1;
    delete pts[e.pointerId]; pinch = 0;
    if (Object.keys(pts).length) { var r = pts[Object.keys(pts)[0]]; lx = r.x; ly = r.y; return; }
    down = false; board.classList.remove('drag');
    if (performance.now() - lt > 80 || still) { vx = vy = 0; }
    schedule();
    if (wasTap && e.type === 'pointerup') {
      var hit = document.elementFromPoint(e.clientX, e.clientY), cardEl = hit && hit.closest('.card');
      if (cardEl) open(+cardEl.dataset.i, cardEl.dataset.k);
    }
  }
  board.addEventListener('pointerup', up);
  board.addEventListener('pointercancel', up);
  board.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) zoomAt(z * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
    else { x -= e.deltaX; y -= e.deltaY; vx = vy = 0; schedule(); }
  }, { passive: false });

  function centre() { return [innerWidth / 2 - (pane.classList.contains('on') && innerWidth > 640 ? 210 : 0), innerHeight / 2]; }
  document.getElementById('zin').onclick = function () { var c = centre(); var nz = Math.min(ZMAX, z * 1.3); animateTo(c[0] - (c[0] - x) * nz / z, c[1] - (c[1] - y) * nz / z, nz); };
  document.getElementById('zout').onclick = function () { var c = centre(); var nz = Math.max(ZMIN, z / 1.3); animateTo(c[0] - (c[0] - x) * nz / z, c[1] - (c[1] - y) * nz / z, nz); };
  document.getElementById('zreset').onclick = function () { var sx = x, sy = y, sz = z; home(); var tx = x, ty = y, tz = z; x = sx; y = sy; z = sz; animateTo(tx, ty, tz); };

  /* opening a photo: highlight its card, slide the panel in */
  function mark(k) {
    if (selKey && live[selKey]) live[selKey].classList.remove('on');
    selKey = k; if (k && live[k]) live[k].classList.add('on');
  }
  function show(i) {
    sel = (i + N) % N;
    big.src = P[sel].src; cap.innerHTML = P[sel].cap; pos.textContent = (sel + 1) + ' of ' + N;
  }
  function open(i, k) {
    show(i); mark(k);
    pane.classList.add('on'); pane.setAttribute('aria-hidden', 'false');
  }
  function close() { pane.classList.remove('on'); pane.setAttribute('aria-hidden', 'true'); mark(null); sel = -1; }
  /* stepping through finds the nearest card on the board showing that photo */
  function step(d) {
    if (sel < 0) return;
    var i = (sel + d + N) % N, best = null, bd = 1e18, cx = innerWidth / 2, cy = innerHeight / 2;
    for (var k in live) if (+live[k].dataset.i === i) {
      var r = live[k].getBoundingClientRect(), dd = Math.pow(r.left + r.width / 2 - cx, 2) + Math.pow(r.top + r.height / 2 - cy, 2);
      if (dd < bd) { bd = dd; best = k; }
    }
    show(i); mark(best);
  }
  document.getElementById('prev').onclick = function () { step(-1); };
  document.getElementById('next').onclick = function () { step(1); };
  document.getElementById('close').onclick = close;
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
    else if (sel >= 0 && e.key === 'ArrowLeft') step(-1);
    else if (sel >= 0 && e.key === 'ArrowRight') step(1);
    else if (sel < 0 && /^Arrow/.test(e.key)) {
      var s = 60; x += e.key === 'ArrowLeft' ? s : e.key === 'ArrowRight' ? -s : 0; y += e.key === 'ArrowUp' ? s : e.key === 'ArrowDown' ? -s : 0; schedule();
    } else if (e.key === '+' || e.key === '=') document.getElementById('zin').click();
    else if (e.key === '-') document.getElementById('zout').click();
  });

  addEventListener('resize', schedule);
  home(); render();
})();
</script>
</body>
</html>
