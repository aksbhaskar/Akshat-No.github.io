<style>
  :root { --bg: #fff; --ink: #111; --muted: #888; --line: #ccc; }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 18px/1.7 "Newsreader", Georgia, serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 14vh 20px 0; }
  h1 { font-size: 18px; font-weight: 400; margin: 0; }
  .site { margin: 0; }
  p { margin: 0; }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-color: var(--ink); }

  /* the round carousel: cards on a 3D ring, spinning on its own, drag to turn */
  .stage { position: relative; height: calc(var(--h) * 2 + 150px); margin: 4vh 0 0; perspective: calc(var(--r) * 3.2);
    perspective-origin: 50% 30%; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .stage.drag { cursor: grabbing; }
  .ring { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
  .card { position: absolute; left: calc(var(--w) / -2); top: calc(var(--h) / -2); width: var(--w); margin: 0; }
  .card .open { display: block; width: 100%; height: var(--h); padding: 0; border: 0; border-radius: 10px; overflow: hidden;
    background: #eee; cursor: inherit; box-shadow: 0 18px 40px -22px rgba(0,0,0,.45); }
  .card figcaption { margin-top: 10px; font-size: 13px; line-height: 1.4; color: var(--muted); text-align: center; transition: opacity .3s ease; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .card .open:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .hint { text-align: center; color: #bbb; font-size: 13px; margin: 0 0 12vh; padding: 0 20px; }

  .lb { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 48px 56px 28px; background: #111; }
  .lb.on { display: flex; }
  .lb img { max-width: 100%; max-height: calc(100vh - 150px); border-radius: 4px; object-fit: contain; }
  .lb p { max-width: 640px; color: #aaa; font-size: 15px; line-height: 1.5; text-align: center; }
  .lb p a { text-decoration-color: #555; }
  .lb button { position: absolute; background: none; border: 0; color: #bbb; font: inherit; cursor: pointer; padding: 12px 16px; }
  .lb button:hover { color: #fff; }
  .lb .prev, .lb .next { top: 50%; transform: translateY(-50%); font-size: 28px; }
  .lb .prev { left: 4px; } .lb .next { right: 4px; }
  .lb .close { top: 6px; right: 6px; font-size: 16px; }
  @media (max-width: 520px) {
    .lb { padding: 48px 12px 24px; }
    .lb .prev, .lb .next { top: auto; bottom: 8px; transform: none; }
  }
</style>

<script>
(function () {
  var stage = document.getElementById('stage'), ring = document.getElementById('ring');
  var cards = [].slice.call(ring.querySelectorAll('.card')), n = cards.length, step = 360 / n;
  var caps = cards.map(function (c) { return c.querySelector('figcaption').innerHTML; });
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var angle = 0, vel = 0, auto = still ? 0 : -0.015, hover = false, dragging = false, lastX = 0, lastT = 0, moved = 0, r = 0;

  function size() {
    var w = Math.max(110, Math.min(200, window.innerWidth * 0.2)), h = w * 1.3;
    r = n * (w + 18) / (2 * Math.PI);
    stage.style.setProperty('--w', w + 'px'); stage.style.setProperty('--h', h + 'px'); stage.style.setProperty('--r', r + 'px');
    cards.forEach(function (c, i) { c.style.transform = 'rotateY(' + (i * step) + 'deg) translateZ(' + r + 'px)'; });
  }
  function frame() {
    if (!dragging) {
      vel *= 0.95;
      if (Math.abs(vel) < 0.02) vel = 0;
      angle += vel + (hover ? 0 : auto);
    }
    ring.style.transform = 'translateZ(' + (-r) + 'px) rotateX(-6deg) rotateY(' + angle + 'deg)';
        cards.forEach(function (c, i) {
      var cos = Math.cos((i * step + angle) * Math.PI / 180);
      c.style.opacity = (cos < 0 ? 0.08 : 0.08 + 0.92 * cos).toFixed(3);
      c.lastChild.style.opacity = cos > 0.75 ? 1 : 0;
      c.style.filter = cos < 0.2 ? 'grayscale(1)' : '';
      c.firstChild.tabIndex = cos > 0.6 ? 0 : -1;
    });
    
    requestAnimationFrame(frame);
  }

  stage.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') hover = true; });
  stage.addEventListener('pointerleave', function () { hover = false; });
  stage.addEventListener('pointerdown', function (e) {
    dragging = true; moved = 0; lastX = e.clientX; lastT = performance.now(); vel = 0;
    stage.classList.add('drag');
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX, t = performance.now(), d = dx * 0.25;
    angle += d; moved += Math.abs(dx);
    vel = d / Math.max(1, t - lastT) * 16;
    lastX = e.clientX; lastT = t;
  });
  window.addEventListener('pointerup', function () { dragging = false; stage.classList.remove('drag'); });
  window.addEventListener('pointercancel', function () { dragging = false; stage.classList.remove('drag'); });

  /* lightbox */
  var lb = document.getElementById('lb'), lbImg = lb.querySelector('img'), lbCap = lb.querySelector('p'), cur = 0;
  function show(i) { cur = (i + n) % n; lbImg.src = cards[cur].querySelector('img').src; lbCap.innerHTML = caps[cur]; }
  function open(i) { show(i); lb.classList.add('on'); document.body.style.overflow = 'hidden'; lb.querySelector('.close').focus(); }
  function close() { lb.classList.remove('on'); document.body.style.overflow = ''; cards[cur].firstChild.focus({ preventScroll: true }); }
  cards.forEach(function (c, i) {
    c.firstChild.addEventListener('click', function (e) {
      if (moved > 6) { e.preventDefault(); return; }
      open(i);
    });
  });
  lb.querySelector('.close').addEventListener('click', close);
  lb.querySelector('.prev').addEventListener('click', function () { show(cur - 1); });
  lb.querySelector('.next').addEventListener('click', function () { show(cur + 1); });
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) {
    if (lb.classList.contains('on')) {
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(cur - 1);
      else if (e.key === 'ArrowRight') show(cur + 1);
    } else if (e.key === 'ArrowLeft') vel += 2.2;
    else if (e.key === 'ArrowRight') vel -= 2.2;
  });

  size(); window.addEventListener('resize', size);
  requestAnimationFrame(frame);
})();
</script>
</body>
